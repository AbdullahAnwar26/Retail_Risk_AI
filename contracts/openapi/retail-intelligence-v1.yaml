openapi: 3.1.0
# ---------------------------------------------------------------------------
# NORMATIVE CONTRACT - Retail Intelligence subsystem, contract v1.
# Source of truth for every endpoint story (planning/15 IC1; spine AD-13; readiness P-4).
# Planning artefact only (PH-3): no server or client code is generated from this file yet.
# Change log: see the end of this file and contracts/README.md.
# ---------------------------------------------------------------------------
info:
  title: Retail Intelligence Subsystem API
  version: 1.2.0
  summary: Advisory retail-banking intelligence (insights, segments, needs, churn, suggestions) behind a jurisdiction policy layer.
  description: >-
    Contract v1 of the retail intelligence subsystem. One contract serves the standalone
    dashboard and plugin hosts (planning/15 IC1). Normative rules that apply to every operation:


    1. **Advisory only (IC2).** Every response is an insight, prediction, suggestion or referral.
    No response type represents a credit approval, decline, limit, pricing or adverse action, and no
    endpoint changes accounts or contacts customers.

    2. **Not for credit decisioning (IC7, DEC-42).** Every JSON response body (success and error)
    carries `not_for_credit_decisioning: true`, and every response carries the header
    `X-Not-For-Credit-Decisioning: true`. Customer-level responses and customer-outcome events also carry
    `permitted_use: [RETAIL_INSIGHT, MARKETING_SUGGESTION]`.

    3. **Jurisdiction and purpose in, policy out (IC4).** Every customer-level request carries a
    `jurisdiction_context` and a consent `purpose`; every customer-level response carries the policy
    decision (`policy.decision_id`, the decision-log record id), the pack versions applied and the
    `bundle_state`.

    4. **Illustrative watermark (DEC-44).** When the runtime bundle is `ILLUSTRATIVE` (standalone demo only),
    `illustrative: true` and the watermark text are set on every response; otherwise `false` / `null`.

    5. **Market-neutral.** Jurisdiction codes, consent purposes, activities, reason codes and segment,
    need and playbook codes are reference data (see `GET /v1/capabilities`), never contract literals.
    The deployment's jurisdiction tree decides what is in scope (planning/14 §2, DEC-50).

    6. **Tolerant reader, strict writer (IC6).** Requests are validated strictly (unknown fields are
    rejected with 400 `VALIDATION_FAILED`). Consumers must ignore unknown response fields and tolerate
    unknown values of fields marked `x-extensible-enum`.

    7. **Tokens only (IC5).** No names, national identifiers, full addresses, phone numbers, e-mail
    addresses or full dates of birth cross this boundary (planning/15 §8).


    8. **Deployment profile, read-only (DEC-61, contract 1.1.0).** Each deployment runs one signed deployment
    profile (planning/21 §3): track, institution type (`CONVENTIONAL` or `ISLAMIC`), data cell, currencies, locales,
    catalogue and institution overlay. `GET /v1/capabilities` shows it; decision and audit records carry it. No
    request field can set or override it, so a caller cannot bypass an institution overlay. Track codes, cell ids
    and reason codes such as `SHARIA_REVIEW_PENDING` or `CELL_SCOPE_MISMATCH` are reference data, not contract literals.

    9. **Contract 1.1.0 additions (DEC-62, DEC-55).** Customer list (tokens only), stored enriched transactions
    (purpose-bound scope `ri.transactions.read`), aggregate-only portfolio summary (`ri.portfolio.read`, small-cell
    suppression) and the Sharia approval record for packs in `ISLAMIC` deployments (`ri.sharia.approve`). All additive.


    10. **Contract 1.1.2 clarifications (independent two-track validation; planning/21 §2.2, §3.1, §10A, §11A).**
    Descriptions and one response floor only, no new field: tokens are not reversible by the subsystem and are keyed per
    data cell and track; the portfolio summary follows aggregate disclosure control AG-1..AG-10; the deployment profile
    cannot be switched by environment, flag or request; a suppression-confirmation review never releases an offer;
    the Sharia approver differs from the maker and from the legal approver.


    11. **Contract 1.2.0 (V-8, V-9; planning/12 DEC-68, §H.7.4; planning/21 §2.3, §4.4).** Additive. (a) Purpose-bound
    customer directory `GET /v1/customer-directory` under the staff-only scope `ri.customers.list`: a closed access
    purpose registered per role and client, a mandatory narrowing filter or an exact token lookup, bounded pages and
    totals, per-user quotas and an audit record for every call including denials. `listCustomers` is deprecated and is
    not implemented by any release (no 1.1.x implementation exists). (b) Sharia disclosure block (`sharia_disclosure`,
    file 20 SDC-11) on product suggestions and credit referrals in `ISLAMIC` deployments only; it can show an approved
    state only with `sharia_status: SHARIA_APPROVED` and the approval references; the demo uses
    `illustrative_sharia_assumption` and the watermark, never an approved state.

    Money is a decimal string with an ISO 4217 currency; timestamps are ISO 8601 UTC.
    Schemas carry `x-ri-output-class` (`CUSTOMER_OUTCOME`, `GOVERNANCE`, `OPERATIONAL`, `INPUT`):
    the CI forbidden-term linter (planning/15 §3.3) scans every `CUSTOMER_OUTCOME` schema.
  contact:
    name: Retail intelligence subsystem owner (planning/12 DEC register)
  license:
    name: Proprietary - internal planning artefact
    url: https://retail-intel.invalid/license
  x-normative: true
  x-planning-refs: [planning/15, planning/14, planning/07, planning/21, planning/12 DEC-42, DEC-44, DEC-45, DEC-46, DEC-47, DEC-50, DEC-55, DEC-61, DEC-62, DEC-68]
servers:
  - url: https://{host}
    description: Deployment-specific host (standalone or plugin). Major version is in the path (/v1).
    variables:
      host:
        default: retail-intel.invalid
        description: Host name of the deployment; `.invalid` is a placeholder.
security:
  - oidc: []
  - oauth2: []
tags:
  - name: Meta
    description: Capabilities, liveness and readiness.
  - name: Customer insights
    description: Profile, features and health indicators (PROFILE_BUILD).
  - name: Transactions
    description: Transaction enrichment (TXN_ENRICHMENT).
  - name: Segments
    description: Segment memberships (SEGMENTATION_INSIGHT, SEGMENTATION_COMMERCIAL).
  - name: Predictions
    description: Churn score and financial needs (CHURN_PREDICTION, NEEDS_PREDICTION).
  - name: Composite
    description: Aggregate evaluate call.
  - name: Recommendations
    description: Catalogue-grounded suggestions and referrals; never credit decisions.
  - name: Retention
    description: Advisory retention actions and outcomes.
  - name: Portfolio
    description: Aggregate-only portfolio counts; no tokens or personal data (DEC-62).
  - name: Human review
    description: Review queue for outputs flagged by CTL-HUMAN-REVIEW or CTL-VULNERABILITY-ROUTE.
  - name: Explanations
    description: Plain-language explanations of prior results.
  - name: Assistant
    description: Read-only staff Q&A over tool results.
  - name: Policy decisions
    description: Policy decision query, decision-log read and replay.
  - name: Policy governance
    description: Pack upload, validation, submission, approval (maker-checker), activation and status (DEC-45, DEC-46).
  - name: Policy simulator
    description: Simulation of candidate packs against the current runtime bundle (synthetic data only).
  - name: Host overlay
    description: Stricter-only host policy overlays (plugin).
  - name: Model registry
    description: RULESET and ML_MODEL registry entries and status transitions (DEC-47).
  - name: Consent and preferences
    description: Host-pushed consent records and contact preferences.
  - name: Bulk ingest
    description: Multi-part bulk data ingest (stateful mode).
  - name: Data subject requests
    description: DSR intake (placeholder in v1).
  - name: Audit
    description: Hash-chained audit and decision-log export.

paths:
  # ------------------------------------------------------------------ Meta
  /health:
    get:
      tags: [Meta]
      operationId: getHealth
      summary: Liveness probe
      description: Liveness only. No authentication. Returns no deployment detail.
      security: []
      responses:
        '200':
          description: Process is alive.
          headers:
            X-Not-For-Credit-Decisioning: {$ref: '#/components/headers/XNotForCreditDecisioning'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthResponse'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /ready:
    get:
      tags: [Meta]
      operationId: getReadiness
      summary: Readiness probe
      description: >-
        Ready = database up + verified L0 + every pack configured for the deployment verified and loadable
        (planning/14 §8.4). An `ILLUSTRATIVE` pack outside a standalone demo deployment makes the instance not ready
        (`ILLUSTRATIVE_PACK_REFUSED`).
      security:
        - oidc: [ri.meta.read]
        - oauth2: [ri.meta.read]
      responses:
        '200':
          description: Instance is ready.
          headers:
            X-Correlation-Id: {$ref: '#/components/headers/XCorrelationId'}
            X-Contract-Version: {$ref: '#/components/headers/XContractVersion'}
            X-Not-For-Credit-Decisioning: {$ref: '#/components/headers/XNotForCreditDecisioning'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReadinessResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503':
          description: Not ready (fail closed). Body lists the failing checks.
          headers:
            X-Correlation-Id: {$ref: '#/components/headers/XCorrelationId'}
            X-Not-For-Credit-Decisioning: {$ref: '#/components/headers/XNotForCreditDecisioning'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReadinessResponse'}
  /v1/capabilities:
    get:
      tags: [Meta]
      operationId: getCapabilities
      summary: Capability manifest
      description: >-
        Contract version, supported activities, jurisdictions in deployment scope, runtime-bundle packs with
        `pack_state`, the `demo` flag, serving registry entries and the reference data a host needs
        (consent purposes, channels, limits). With no jurisdiction pack loaded the bundle is shown as empty.
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - $ref: '#/components/parameters/TraceparentHeader'
        - $ref: '#/components/parameters/XContractVersionHeader'
      security:
        - oidc: [ri.meta.read]
        - oauth2: [ri.meta.read]
      responses:
        '200':
          description: Capability manifest.
          headers:
            X-Correlation-Id: {$ref: '#/components/headers/XCorrelationId'}
            X-Contract-Version: {$ref: '#/components/headers/XContractVersion'}
            X-Not-For-Credit-Decisioning: {$ref: '#/components/headers/XNotForCreditDecisioning'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CapabilitiesResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '412': {$ref: '#/components/responses/ContractVersionUnsupported'}
        '429': {$ref: '#/components/responses/RateLimited'}

  # ------------------------------------------------------------------ Customer insights
  /v1/customers:
    get:
      tags: [Customer insights]
      operationId: listCustomers
      deprecated: true
      x-ri-implement: false
      summary: Customer list for the picker (tokens only) - deprecated in 1.2.0, not implemented
      description: >-
        **Deprecated in contract 1.2.0 and not implemented (V-8, DEC-68).** It had no access purpose, no narrowing
        filter and a scope (`ri.insights.read`) also held by `auditor` and `service_host`, so it allowed bulk token
        enumeration. Use `searchCustomerDirectory` (`GET /v1/customer-directory`). No release of contract 1.x serves
        this route (it answers 404 `NOT_FOUND` like any unknown path); because no 1.1.x implementation or consumer
        exists, the DEC-31 dual-serving period does not apply. Kept in the document only so the 1.1.x -> 1.2.0 diff
        stays additive. Original 1.1.0 text follows. Lists customers stored in the serving data cell (stateful mode) for the dashboard picker (S01). Rows are
        filtered to the caller's `ri_jurisdictions` claim (ROW_FILTER; no 403). Each row carries only the customer
        token, the resolved residence jurisdiction code, the protection status, a data-quality status and the last
        update time: no name, contact data, address, ZIP code, account number or date of birth (IC5). Minors and
        age-unknown customers are listed only with their protection status, so the UI can show the protected
        journey; no commercial data is attached. Rows from another data cell or track never appear (DEC-52, DEC-53).
      x-activity: PROFILE_BUILD
      parameters:
        - name: protection_status
          in: query
          required: false
          description: Filter by protection status.
          schema: {$ref: '#/components/schemas/AgeStatus'}
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/CursorQuery'
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - $ref: '#/components/parameters/TraceparentHeader'
        - $ref: '#/components/parameters/XContractVersionHeader'
        - $ref: '#/components/parameters/XOnBehalfOfHeader'
      security:
        - oidc: [ri.insights.read]
        - oauth2: [ri.insights.read]
      responses:
        '200':
          description: Page of customer rows ordered by (created_at, customer_token).
          headers:
            X-Correlation-Id: {$ref: '#/components/headers/XCorrelationId'}
            X-Contract-Version: {$ref: '#/components/headers/XContractVersion'}
            X-Not-For-Credit-Decisioning: {$ref: '#/components/headers/XNotForCreditDecisioning'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CustomerListPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '412': {$ref: '#/components/responses/ContractVersionUnsupported'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /v1/customer-directory:
    get:
      tags: [Customer insights]
      operationId: searchCustomerDirectory
      summary: Purpose-bound customer directory for the staff picker (tokens only)
      description: >-
        Staff picker (S01) for the serving data cell (stateful mode; contract 1.2.0, V-8, DEC-68; planning/21 §2.3).
        Returns the same token-only rows as the deprecated `listCustomers` (customer token, residence jurisdiction
        code, protection status, data-quality status, update time; no name, contact data, address, ZIP, account number
        or date of birth; IC5), under these controls. **Scope:** `ri.customers.list`, held only by `analyst` and
        `relationship_staff`; never by `auditor`, `service_host` or any other role (deny by default). **Purpose:**
        `access_purpose` is required and must be a value of the closed list `DirectoryAccessPurpose` registered for the
        caller's role and, for a machine client, its `client_id` (no client is registered in contract 1.2.0); missing or
        unknown -> 400 `ACCESS_PURPOSE_INVALID`; valid but not registered -> 403 `ACCESS_PURPOSE_NOT_REGISTERED`.
        **Operational access vs enumeration:** a call with `customer_token` is an exact lookup (operational access): it
        returns that row or an empty page, the same for an unknown token, a token from another cell or track and a
        token outside the caller's claim (no existence leak). Any call without `customer_token` is enumeration: it needs
        at least one narrowing filter (`segment_code` or `data_quality_status`; `protection_status` and
        `residence_jurisdiction` narrow further but are not enough alone), otherwise 400 `NARROWING_FILTER_REQUIRED`.
        **Bounds:** page size at most 25 (default 25); at most `max_results` rows per query across all its pages
        (config, default 100 [ASSUME], may be lowered, never raised above 100), after which `next_cursor` is null and
        `access.result_capped` is true; the cursor is bound to the user, purpose and filters (a changed value with the
        same cursor -> 400 `VALIDATION_FAILED`); per-user daily quotas (config, defaults 200 calls and 500 enumerated
        rows [ASSUME]) -> 429 `ACCESS_QUOTA_EXCEEDED`. Repeated filter variations by one user raise a security alert
        for review; the alert never relaxes a rule. **Audit:** every call after token validation, allowed or denied,
        writes an `audit_record` with an `access` block (account, client, role, scope, purpose, access kind, filters,
        result count, outcome, denial code) plus the record's timestamp, cell and track. Check order: 401, scope 403,
        purpose 400/403, narrowing 400, quota 429, then ROW_FILTER by the `ri_jurisdictions` claim. Rows from another
        data cell or track never appear (DEC-52, DEC-53, planning/21 §2.1, §2.2). A `segment_code` filter also needs
        `ri.segments.read` (else 403 `FORBIDDEN_SCOPE`). Minors and age-unknown customers appear only with their
        protection status (planning/14 §13.3).
      x-activity: PROFILE_BUILD
      x-ri-narrowing-filters: [customer_token, segment_code, data_quality_status]
      parameters:
        - $ref: '#/components/parameters/AccessPurposeQuery'
        - name: customer_token
          in: query
          required: false
          description: Exact token lookup (operational access); at most one row is returned.
          schema: {$ref: '#/components/schemas/Token'}
        - name: segment_code
          in: query
          required: false
          description: Narrowing filter - customers with a current membership of this segment code (reference data). Needs `ri.segments.read` as well.
          schema: {$ref: '#/components/schemas/ReferenceCode'}
        - name: data_quality_status
          in: query
          required: false
          description: Narrowing filter - data-quality status.
          schema: {type: string, enum: [SUFFICIENT, INSUFFICIENT]}
        - name: protection_status
          in: query
          required: false
          description: Additional filter (not narrowing on its own).
          schema: {$ref: '#/components/schemas/AgeStatus'}
        - name: residence_jurisdiction
          in: query
          required: false
          description: Additional filter (not narrowing on its own) - a code of the serving cell's tree; rows outside the claim are never returned.
          schema: {$ref: '#/components/schemas/JurisdictionCode'}
        - name: limit
          in: query
          required: false
          description: Page size (cursor pagination), at most 25.
          schema: {type: integer, minimum: 1, maximum: 25, default: 25}
        - $ref: '#/components/parameters/CursorQuery'
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - $ref: '#/components/parameters/TraceparentHeader'
        - $ref: '#/components/parameters/XContractVersionHeader'
        - $ref: '#/components/parameters/XOnBehalfOfHeader'
      security:
        - oidc: [ri.customers.list]
        - oauth2: [ri.customers.list]
      responses:
        '200':
          description: Page of customer rows ordered by (created_at, customer_token); empty for an unknown token.
          headers:
            X-Correlation-Id: {$ref: '#/components/headers/XCorrelationId'}
            X-Contract-Version: {$ref: '#/components/headers/XContractVersion'}
            X-Not-For-Credit-Decisioning: {$ref: '#/components/headers/XNotForCreditDecisioning'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CustomerDirectoryPage'}
              examples:
                narrowedEnumeration:
                  summary: Analyst lists customers with insufficient data quality (synthetic)
                  value:
                    contract_version: 1.2.0
                    correlation_id: corr-8b1d2e
                    not_for_credit_decisioning: true
                    illustrative: true
                    watermark: illustrative - not legal advice - not for real customers
                    permitted_use: [RETAIL_INSIGHT, MARKETING_SUGGESTION]
                    next_cursor: null
                    limit: 25
                    items:
                      - customer_token: cust_tok_Q
                        residence_jurisdiction: US-NY-NYC
                        protection_status: ADULT
                        data_quality_status: INSUFFICIENT
                        updated_at: '2026-11-09T02:10:00Z'
                    access:
                      access_purpose: INSIGHT_REVIEW
                      access_kind: ENUMERATION
                      result_capped: false
                      max_results: 100
                      access_audit_id: aud_01JCA0K2M4
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '412': {$ref: '#/components/responses/ContractVersionUnsupported'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /v1/customers/{customer_token}/insights:evaluate:
    post:
      tags: [Customer insights]
      operationId: evaluateCustomerInsights
      summary: Stateless profile evaluation
      description: Builds profile, features and health indicators from the supplied data window. Deterministic for identical inputs and versions.
      x-activity: PROFILE_BUILD
      parameters:
        - $ref: '#/components/parameters/CustomerTokenPath'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - $ref: '#/components/parameters/TraceparentHeader'
        - $ref: '#/components/parameters/XContractVersionHeader'
        - $ref: '#/components/parameters/XOnBehalfOfHeader'
      security:
        - oidc: [ri.insights.read]
        - oauth2: [ri.insights.read]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CustomerEvaluateRequest'}
            examples:
              adult:
                $ref: '#/components/examples/CustomerEvaluateRequestExample'
      responses:
        '200':
          description: Profile result.
          headers:
            X-Correlation-Id: {$ref: '#/components/headers/XCorrelationId'}
            X-Contract-Version: {$ref: '#/components/headers/XContractVersion'}
            X-Not-For-Credit-Decisioning: {$ref: '#/components/headers/XNotForCreditDecisioning'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InsightsResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/ContractVersionUnsupported'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /v1/customers/{customer_token}/insights:
    get:
      tags: [Customer insights]
      operationId: getStoredCustomerInsights
      summary: Latest stored profile (stateful mode)
      x-activity: PROFILE_BUILD
      parameters:
        - $ref: '#/components/parameters/CustomerTokenPath'
        - $ref: '#/components/parameters/ResidenceJurisdictionQuery'
        - $ref: '#/components/parameters/BookingEntityJurisdictionQuery'
        - $ref: '#/components/parameters/ServicingLocationQuery'
        - $ref: '#/components/parameters/ChannelQuery'
        - $ref: '#/components/parameters/PurposeQuery'
        - $ref: '#/components/parameters/ConsentRefQuery'
        - $ref: '#/components/parameters/AsOfQuery'
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - $ref: '#/components/parameters/TraceparentHeader'
        - $ref: '#/components/parameters/XContractVersionHeader'
        - $ref: '#/components/parameters/XOnBehalfOfHeader'
      security:
        - oidc: [ri.insights.read]
        - oauth2: [ri.insights.read]
      responses:
        '200':
          description: Stored profile.
          headers:
            X-Correlation-Id: {$ref: '#/components/headers/XCorrelationId'}
            X-Contract-Version: {$ref: '#/components/headers/XContractVersion'}
            X-Not-For-Credit-Decisioning: {$ref: '#/components/headers/XNotForCreditDecisioning'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InsightsResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  # ------------------------------------------------------------------ Transactions
  /v1/transactions:enrich:
    post:
      tags: [Transactions]
      operationId: enrichTransactions
      summary: Categorise and flag a batch of transactions
      description: Categorise and flag recurring, transfer, refund, reversal and duplicate transactions for one subject. Maximum 5,000 transactions per call.
      x-activity: TXN_ENRICHMENT
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - $ref: '#/components/parameters/TraceparentHeader'
        - $ref: '#/components/parameters/XContractVersionHeader'
      security:
        - oidc: [ri.transactions.enrich]
        - oauth2: [ri.transactions.enrich]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EnrichTransactionsRequest'}
      responses:
        '200':
          description: Enriched transactions and row-level rejects.
          headers:
            X-Correlation-Id: {$ref: '#/components/headers/XCorrelationId'}
            X-Contract-Version: {$ref: '#/components/headers/XContractVersion'}
            X-Not-For-Credit-Decisioning: {$ref: '#/components/headers/XNotForCreditDecisioning'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EnrichTransactionsResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  # ------------------------------------------------------------------ Segments and predictions
  /v1/customers/{customer_token}/transactions:
    get:
      tags: [Transactions]
      operationId: getStoredCustomerTransactions
      summary: Stored enriched transactions (stateful mode)
      description: >-
        Enriched view of the customer's stored transactions for the customer view (S02, UJ-1 step 2). Purpose-bound:
        requires scope `ri.transactions.read` and `purpose=INSIGHT`; any other purpose is denied by the PDP
        (403 `POLICY_DENIED`). Returns date, amount, currency, transaction kind, category code and flags only: no raw
        description, counterparty, merchant name or location. Sensitive, protection-only or institution-prohibited
        categories (planning/14 §13.2; planning/21 §4.2 `CTL-PROHIBITED-CATEGORY`) appear only as neutral category
        codes and are never labelled with an inferred characteristic. Minors and age-unknown customers: 403
        `MINOR_PROTECTED` (enrichment is limited to age and routing checks, planning/14 §13.3).
      x-activity: TXN_ENRICHMENT
      parameters:
