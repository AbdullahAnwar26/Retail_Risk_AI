        lacks data returns `status: DENIED` or `DATA_QUALITY_INSUFFICIENT` with reason codes and is never silently
        omitted (planning/15 §4 partial results). A section whose scope the caller lacks is returned as DENIED with
        reason `FORBIDDEN_SCOPE`.
      x-activity: [PROFILE_BUILD, SEGMENTATION_INSIGHT, SEGMENTATION_COMMERCIAL, NEEDS_PREDICTION, CHURN_PREDICTION, PRODUCT_RECOMMENDATION, CREDIT_PRODUCT_REFERRAL, MARKETING_ELIGIBILITY]
