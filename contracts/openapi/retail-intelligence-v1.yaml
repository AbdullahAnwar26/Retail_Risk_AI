  schemas:
    # ---------------------------------------------------------------- primitives
    Identifier:
      type: string
      description: Opaque server id (prefixes such as `res_`, `dec_`, `rec_`, `rvw_`, `act_`, `sim_`, `bat_` are conventional, not contractual).
      pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]{2,127}$'
    Token:
      type: string
      description: >-
        Host-issued token (customer, account, consent). The host tokenisation service owns the mapping, in the serving
        data cell's region; the subsystem holds no mapping and cannot reverse a token. Tokens are random surrogates or
        keyed per data cell and track, so the same person has unrelated tokens in different cells and tracks, and no
        response carries a cross-context identifier. A token from another cell or track is not found (planning/21 §2.2).
      pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]{2,127}$'
    CorrelationId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9_.:-]+$'
    SemVer:
      type: string
      pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
    VersionLabel:
      type: string
      description: Version label of a model, ruleset, feature set, catalogue, config or taxonomy.
      minLength: 1
      maxLength: 64
      pattern: '^[A-Za-z0-9][A-Za-z0-9_.+-]*$'
    Sha256:
      type: string
      pattern: '^[a-f0-9]{64}$'
    AsOf:
      type: string
      description: ISO 8601 date or UTC date-time.
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}(T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,6})?Z)?$'
    DecimalAmount:
      type: string
      description: Decimal string; never a binary float.
      pattern: '^-?(0|[1-9][0-9]{0,14})(\.[0-9]{1,6})?$'
    CurrencyCode:
      type: string
      description: ISO 4217 alphabetic code.
      pattern: '^[A-Z]{3}$'
    LanguageTag:
      type: string
      description: BCP 47 language tag.
      pattern: '^[a-z]{2,3}(-[A-Za-z0-9]{2,8})*$'
    ReferenceCode:
      type: string
      description: Code from versioned reference data (reason codes, segment codes, need codes, playbook actions, DQ rules).
      pattern: '^[A-Z][A-Z0-9_.-]{1,63}$'
    ControlId:
      type: string
      description: Control catalogue id (planning/14 §5).
      pattern: '^CTL-[A-Z0-9-]{2,60}$'
    PackId:
      type: string
      pattern: '^PACK-[A-Z0-9-]{1,60}$'
    PolicyId:
      type: string
      pattern: '^POL-[A-Z0-9-]{1,60}$'
    JurisdictionCode:
      type: string
      description: >-
        Jurisdiction code from the deployment's jurisdiction tree (reference data; planning/07 `jurisdiction`).
        `*` is the global baseline; country codes follow ISO 3166-1 alpha-2 and subdivisions ISO 3166-2, with
        deployment-defined local levels appended (examples only - `US-NY-NYC`, `AE-DU`). `UNKNOWN` selects the
        restrictive default. Codes outside the deployment scope resolve to `UNSUPPORTED_JURISDICTION`.
      pattern: '^(\*|UNKNOWN|[A-Z]{2}(-[A-Z0-9]{1,10}){0,3})$'
    Channel:
      type: string
      description: Channel taxonomy (planning/14 §3.4). New values are a minor version.
      enum: [MOBILE_APP, WEB, BRANCH_STAFF, EMAIL, SMS, PUSH, CALL_CENTRE]
    ConsentPurpose:
      type: string
      description: >-
        Consent purpose code from deployment reference data (AD-17; taxonomy DEC-18 [LEGAL-CONFIRM]). Validated against
        config, not a contract enum. Known values are listed in `x-extensible-enum`.
      pattern: '^[A-Z][A-Z0-9_]{1,63}$'
      x-extensible-enum: [INSIGHT, PERSONALISATION, MARKETING, AFFILIATE_MARKETING, CHANNEL_EMAIL, CHANNEL_SMS, CHANNEL_PUSH, CHANNEL_CALL, MINOR_EDU]
    Activity:
      type: string
      description: Activity taxonomy (planning/14 §3.3). An unknown activity is DENY, never 400. There is no credit-decision activity.
      pattern: '^[A-Z][A-Z0-9_]{1,63}$'
      x-extensible-enum: [TXN_ENRICHMENT, PROFILE_BUILD, SEGMENTATION_INSIGHT, SEGMENTATION_COMMERCIAL, NEEDS_PREDICTION, CHURN_PREDICTION, PRODUCT_RECOMMENDATION, CREDIT_PRODUCT_REFERRAL, RETENTION_SUGGESTION, MARKETING_ELIGIBILITY, EXPLANATION_GENERATION, ASSISTANT_QA, DATA_RETENTION, AUDIT_EXPORT, MODEL_TRAINING, FAIRNESS_MONITORING]
    AgeStatus:
      type: string
      description: Host-computed age status. AGE_UNKNOWN is treated as minor for commercial activities.
      enum: [ADULT, MINOR_PROTECTED, AGE_UNKNOWN]
    ReviewerRole:
      type: string
      description: >-
        Staff role that must handle a review item or retention action (CTL-HUMAN-REVIEW / CTL-VULNERABILITY-ROUTE
        `role` param). Subset of the role matrix (planning/15 §5.1); governance roles never appear in customer-outcome
        schemas. New values are a minor version.
      enum: [analyst, relationship_staff]
    DecisionOutcome:
      type: string
      description: INDETERMINATE is never returned; it is enforced as DENY with reason POLICY_INDETERMINATE.
      enum: [PERMIT, PERMIT_WITH_OBLIGATIONS, DENY]
    BundleState:
      type: string
      description: State of the runtime bundle that decided (DEC-45). ILLUSTRATIVE only in a standalone demo deployment.
      enum: [ACTIVE, ILLUSTRATIVE]
    PackState:
      type: string
      description: Pack lifecycle (planning/14 §8.4, DEC-45). VALIDATED is the loaded-but-unapproved state (simulator only).
      enum: [DRAFT, VALIDATED, IN_LEGAL_REVIEW, APPROVED, ACTIVE, ILLUSTRATIVE, RETIRED]
      x-ri-output-class: GOVERNANCE
    InstitutionType:
      type: string
      description: Institution type from the deployment profile (DEC-51, DEC-54). `ISLAMIC` loads the tighten-only institution overlay.
      enum: [CONVENTIONAL, ISLAMIC]
    ShariaApprovalStatus:
      type: string
      description: Sharia approval state of a policy, catalogue item, template or reason-code text (DEC-55). Governance lifecycle values.
      enum: [NOT_REVIEWED, IN_SHARIA_REVIEW, SHARIA_APPROVED, SHARIA_REJECTED, RETIRED]
      x-ri-output-class: GOVERNANCE
    DeploymentProfile:
      type: object
      description: >-
        Read-only deployment profile (planning/21 §3, §3.1; DEC-61). Loaded and signature-checked at bootstrap against
        track-bound keys; a missing, invalid, altered, incompatible or rolled-back profile keeps the instance not ready.
        Never set by a request, header, environment variable or feature flag. `track` and `cell_id` are reference codes,
        not contract literals.
      x-ri-output-class: GOVERNANCE
      required: [profile_id, profile_version, track, institution_type, cell_id, currencies, locales, catalogue_id, institution_overlay]
      properties:
        profile_id: {$ref: '#/components/schemas/Identifier'}
        profile_version: {$ref: '#/components/schemas/SemVer'}
        profile_sha256: {$ref: '#/components/schemas/Sha256'}
        track: {$ref: '#/components/schemas/ReferenceCode'}
        institution_type: {$ref: '#/components/schemas/InstitutionType'}
        cell_id: {$ref: '#/components/schemas/ReferenceCode'}
        currencies:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/CurrencyCode'}
        locales:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/LanguageTag'}
        catalogue_id: {$ref: '#/components/schemas/ReferenceCode'}
        institution_overlay:
          description: Institution overlay pack, or null for CONVENTIONAL.
          oneOf:
            - $ref: '#/components/schemas/PackRef'
            - type: 'null'
    RegistryKind:
      type: string
      enum: [RULESET, ML_MODEL]
    RegistryStatus:
      type: string
      description: 'RULESET: DRAFT, ACTIVE, RETIRED. ML_MODEL: DRAFT, SHADOW, APPROVED, RETIRED (DEC-47). Governance lifecycle values.'
      enum: [DRAFT, ACTIVE, SHADOW, APPROVED, RETIRED]
      x-ri-output-class: GOVERNANCE
    ReviewState:
      type: string
      enum: [QUEUED, IN_REVIEW, CLEARED_TO_SHOW, REJECTED, ESCALATED, EXPIRED, CANCELLED]
    Watermark:
      description: Watermark text when the bundle is ILLUSTRATIVE, otherwise null (DEC-44).
      type: [string, 'null']
      enum: ['illustrative - not legal advice - not for real customers', null]

    # ---------------------------------------------------------------- labels (every response)
    ResponseLabels:
      type: object
      description: Labels carried by every JSON response body (IC7, DEC-42, DEC-44).
      x-ri-output-class: OPERATIONAL
      required: [contract_version, correlation_id, not_for_credit_decisioning, illustrative, watermark]
      properties:
        contract_version: {$ref: '#/components/schemas/SemVer'}
        correlation_id: {$ref: '#/components/schemas/CorrelationId'}
        not_for_credit_decisioning:
          type: boolean
          const: true
          description: Outputs must not be used for credit eligibility, underwriting, pricing, limits or any other credit decision (IC7).
        illustrative:
          type: boolean
          description: True only when the runtime bundle is ILLUSTRATIVE (standalone demo).
        watermark: {$ref: '#/components/schemas/Watermark'}
      if:
        properties: {illustrative: {const: true}}
      then:
        properties: {watermark: {const: 'illustrative - not legal advice - not for real customers'}}
      else:
        properties: {watermark: {const: null}}
    PermittedUse:
      type: array
      description: Permitted uses of a customer-level output (IC7). Always exactly these two values.
      minItems: 2
      maxItems: 2
      uniqueItems: true
      items:
        type: string
        enum: [RETAIL_INSIGHT, MARKETING_SUGGESTION]
    CustomerResponseLabels:
      description: Labels and policy block carried by every customer-level response (IC4, IC7).
      x-ri-output-class: CUSTOMER_OUTCOME
      allOf:
        - $ref: '#/components/schemas/ResponseLabels'
        - type: object
          required: [result_id, advisory_only, permitted_use, subject, policy, versions]
          properties:
            result_id: {$ref: '#/components/schemas/Identifier'}
            advisory_only: {type: boolean, const: true}
            permitted_use: {$ref: '#/components/schemas/PermittedUse'}
            subject: {$ref: '#/components/schemas/SubjectOut'}
            policy: {$ref: '#/components/schemas/PolicyApplied'}
            versions: {$ref: '#/components/schemas/Versions'}
    SubjectOut:
      type: object
      x-ri-output-class: CUSTOMER_OUTCOME
      required: [customer_token, protection_status]
      properties:
        customer_token: {$ref: '#/components/schemas/Token'}
        protection_status: {$ref: '#/components/schemas/AgeStatus'}
    PackRef:
      type: object
      required: [pack_id, pack_version]
      properties:
        pack_id: {$ref: '#/components/schemas/PackId'}
        pack_version: {$ref: '#/components/schemas/SemVer'}
        manifest_sha256: {$ref: '#/components/schemas/Sha256'}
    Obligation:
      type: object
      required: [control_id]
      properties:
        control_id: {$ref: '#/components/schemas/ControlId'}
        params:
          type: object
          description: Control parameters validated against the control's param schema.
          additionalProperties: true
    PolicyApplied:
      type: object
      description: Policy decision applied to this response. `decision_id` is the decision-log record id (decision_log_id) for read and replay.
      x-ri-output-class: CUSTOMER_OUTCOME
      required: [decision_id, bundle_state, outcome, jurisdiction_set, packs_applied, effective_bundle_sha256, obligations, flags]
      properties:
        decision_id: {$ref: '#/components/schemas/Identifier'}
        bundle_state: {$ref: '#/components/schemas/BundleState'}
        outcome: {$ref: '#/components/schemas/DecisionOutcome'}
        jurisdiction_set:
          type: array
          items: {$ref: '#/components/schemas/JurisdictionCode'}
        packs_applied:
          type: array
          description: Policy pack versions applied (policy versions applied).
          items: {$ref: '#/components/schemas/PackRef'}
        host_overlay_id: {type: [string, 'null']}
        effective_bundle_sha256: {$ref: '#/components/schemas/Sha256'}
        obligations:
          type: array
          items: {$ref: '#/components/schemas/Obligation'}
        reason_codes:
          type: array
          items: {$ref: '#/components/schemas/ReferenceCode'}
        flags:
          type: array
          description: e.g. PENDING_LEGAL_REVIEW, ILLUSTRATIVE, UNKNOWN_JURISDICTION.
          items: {$ref: '#/components/schemas/ReferenceCode'}
          x-extensible-enum: [PENDING_LEGAL_REVIEW, ILLUSTRATIVE, UNKNOWN_JURISDICTION, UNSUPPORTED_JURISDICTION, MINOR_PROTECTED]
    Versions:
      type: object
      description: Independent version axes (planning/15 §6). Pack versions are in `policy.packs_applied`.
      properties:
        model: {$ref: '#/components/schemas/VersionLabel'}
        feature_set: {$ref: '#/components/schemas/VersionLabel'}
        catalogue: {$ref: '#/components/schemas/VersionLabel'}
        config: {$ref: '#/components/schemas/VersionLabel'}
        taxonomy: {$ref: '#/components/schemas/VersionLabel'}
        reason_code_library: {$ref: '#/components/schemas/VersionLabel'}
    Explanation:
      type: object
      x-ri-output-class: CUSTOMER_OUTCOME
      required: [text, language, generated_by, numbers_verified, ai_assisted]
      properties:
        text: {type: string, maxLength: 4000}
        language: {$ref: '#/components/schemas/LanguageTag'}
        generated_by: {type: string, enum: [TEMPLATE, LLM_VERIFIED]}
        template_id: {$ref: '#/components/schemas/VersionLabel'}
        numbers_verified: {type: boolean}
        ai_assisted: {type: boolean, description: Set when CTL-AI-DISCLOSURE applies.}
    SectionDenied:
      type: object
      description: A composite section that was denied or lacked data (never silently omitted).
      x-ri-output-class: CUSTOMER_OUTCOME
      required: [status, reason_codes, decision_id]
      properties:
        status: {type: string, enum: [DENIED, DATA_QUALITY_INSUFFICIENT]}
        reason_codes:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/ReferenceCode'}
        decision_id: {$ref: '#/components/schemas/Identifier'}
        failed_rule_ids:
          type: array
          items: {$ref: '#/components/schemas/ReferenceCode'}

    # ---------------------------------------------------------------- request envelope
    JurisdictionContext:
      type: object
      description: >-
        Customer jurisdiction context (planning/14 §3.4). All attributes are unioned with their ancestors. Missing or
        unknown attributes resolve to the restrictive default; no attribute is assumed.
      x-ri-output-class: INPUT
      additionalProperties: false
      required: [residence_jurisdiction]
      properties:
        residence_jurisdiction: {$ref: '#/components/schemas/JurisdictionCode'}
        booking_entity_jurisdiction: {$ref: '#/components/schemas/JurisdictionCode'}
        servicing_location: {$ref: '#/components/schemas/JurisdictionCode'}
        channel: {$ref: '#/components/schemas/Channel'}
    ConsentContext:
      type: object
      x-ri-output-class: INPUT
      additionalProperties: false
      required: [purpose]
      properties:
        purpose: {$ref: '#/components/schemas/ConsentPurpose'}
        consent_refs:
          type: array
          maxItems: 20
          items: {$ref: '#/components/schemas/Token'}
    HostSegment:
      type: object
      description: Read-only host attribute (CI-1, [OPEN]); never a ranking feature for credit products.
      additionalProperties: false
      required: [code, source, origin, as_of]
      properties:
        code: {$ref: '#/components/schemas/ReferenceCode'}
        source: {type: string, enum: [HOST]}
        origin: {type: string, enum: [HOST_CORE, CREDIT_PLATFORM]}
        as_of: {$ref: '#/components/schemas/AsOf'}
    SubjectIn:
      type: object
      x-ri-output-class: INPUT
      additionalProperties: false
      required: [customer_token, age_status]
      properties:
        customer_token: {$ref: '#/components/schemas/Token'}
        age_status: {$ref: '#/components/schemas/AgeStatus'}
        birth_year_month:
          type: string
          description: Optional birth year-month; full date of birth never crosses the boundary.
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
        host_segments:
          type: array
          maxItems: 50
          items: {$ref: '#/components/schemas/HostSegment'}
    AccountIn:
      type: object
      additionalProperties: false
      required: [account_token, type, currency]
      properties:
        account_token: {$ref: '#/components/schemas/Token'}
        type: {type: string, enum: [CURRENT, SAVINGS, CARD, LOAN]}
        currency: {$ref: '#/components/schemas/CurrencyCode'}
        opened_on: {type: string, format: date}
        closed_on: {type: [string, 'null'], format: date}
        is_joint: {type: boolean}
        booking_entity_jurisdiction: {$ref: '#/components/schemas/JurisdictionCode'}
    TransactionIn:
      type: object
      additionalProperties: false
      required: [txn_ref, account_token, booking_ts, amount, currency, status]
      properties:
        txn_ref: {type: string, minLength: 1, maxLength: 128, description: 'Host source transaction id; dedupe key = (account_token, txn_ref).'}
        account_token: {$ref: '#/components/schemas/Token'}
        booking_ts: {type: string, format: date-time}
        value_date: {type: string, format: date}
        amount: {$ref: '#/components/schemas/DecimalAmount'}
        currency: {$ref: '#/components/schemas/CurrencyCode'}
        status: {type: string, enum: [PENDING, BOOKED, REVERSED]}
        related_txn_ref: {type: [string, 'null'], maxLength: 128}
        merchant_ref: {type: string, maxLength: 128}
        mcc: {type: string, pattern: '^[0-9]{4}$'}
        description_redacted:
          type: string
          maxLength: 256
          description: Optional, host-redacted, treated as untrusted input (prompt-injection safe handling).
    FinancialGoalIn:
      type: object
      additionalProperties: false
      required: [goal_ref, goal_type, source]
      properties:
        goal_ref: {type: string, maxLength: 128}
        goal_type: {$ref: '#/components/schemas/ReferenceCode'}
        target_amount: {$ref: '#/components/schemas/DecimalAmount'}
        currency: {$ref: '#/components/schemas/CurrencyCode'}
        target_date: {type: string, format: date}
        source: {type: string, enum: [CUSTOMER, HOST]}
    EvaluateData:
      type: object
      additionalProperties: false
      properties:
        accounts:
          type: array
          maxItems: 200
          items: {$ref: '#/components/schemas/AccountIn'}
        transactions:
          type: array
          maxItems: 5000
          items: {$ref: '#/components/schemas/TransactionIn'}
        goals:
          type: array
          maxItems: 50
          items: {$ref: '#/components/schemas/FinancialGoalIn'}
    RequestOptions:
      type: object
      additionalProperties: false
      properties:
        explanation:
          type: object
          additionalProperties: false
          properties:
            language: {$ref: '#/components/schemas/LanguageTag'}
            allow_llm: {type: boolean, default: false, description: Request only; CTL-LLM-GUARDRAIL decides.}
        max_recommendations: {type: integer, minimum: 1, maximum: 20, default: 5}
    CustomerEvaluateRequest:
      type: object
      description: Canonical customer-level request envelope (planning/15 §3.1). Strict validation.
      x-ri-output-class: INPUT
      additionalProperties: false
      required: [contract_version, correlation_id, jurisdiction_context, consent, subject]
      properties:
        contract_version: {$ref: '#/components/schemas/SemVer'}
        correlation_id: {$ref: '#/components/schemas/CorrelationId'}
        as_of: {$ref: '#/components/schemas/AsOf'}
        jurisdiction_context: {$ref: '#/components/schemas/JurisdictionContext'}
        consent: {$ref: '#/components/schemas/ConsentContext'}
        subject: {$ref: '#/components/schemas/SubjectIn'}
        host_policy_decision_ref: {type: [string, 'null'], maxLength: 128}
        data: {$ref: '#/components/schemas/EvaluateData'}
        options: {$ref: '#/components/schemas/RequestOptions'}

    # ---------------------------------------------------------------- meta
    HealthResponse:
      x-ri-output-class: OPERATIONAL
      allOf:
        - $ref: '#/components/schemas/ResponseLabels'
        - type: object
          required: [status]
          properties:
            status: {type: string, enum: [UP]}
    ReadinessResponse:
      x-ri-output-class: OPERATIONAL
      allOf:
        - $ref: '#/components/schemas/ResponseLabels'
        - type: object
          required: [ready, checks]
          properties:
            ready: {type: boolean}
            checks:
              type: array
              items:
                type: object
                required: [check, passed]
                properties:
                  check: {type: string, enum: [DATABASE, L0_VERIFIED, PACKS_VERIFIED, PACK_STATE_PERMITTED]}
                  passed: {type: boolean}
                  reason_code: {$ref: '#/components/schemas/ReferenceCode'}
    RuntimePack:
      type: object
      required: [pack_id, pack_version, pack_state]
      properties:
        pack_id: {$ref: '#/components/schemas/PackId'}
        pack_version: {$ref: '#/components/schemas/SemVer'}
        pack_state: {$ref: '#/components/schemas/PackState'}
        scope_root: {$ref: '#/components/schemas/JurisdictionCode'}
        manifest_sha256: {$ref: '#/components/schemas/Sha256'}
    RegistryEntryRef:
      type: object
      required: [model_id, version, kind, status]
      properties:
        model_id: {$ref: '#/components/schemas/Identifier'}
        version: {$ref: '#/components/schemas/VersionLabel'}
        kind: {$ref: '#/components/schemas/RegistryKind'}
        status: {$ref: '#/components/schemas/RegistryStatus'}
        activity: {$ref: '#/components/schemas/Activity'}
    CapabilitiesResponse:
      x-ri-output-class: GOVERNANCE
      allOf:
        - $ref: '#/components/schemas/ResponseLabels'
        - type: object
          required: [deployment_id, mode, demo, deployment_profile, supported_activities, jurisdictions_in_scope, runtime_bundle, serving_registry]
          properties:
            deployment_id: {$ref: '#/components/schemas/Identifier'}
            deployment_profile: {$ref: '#/components/schemas/DeploymentProfile'}
            mode: {type: string, enum: [STANDALONE, PLUGIN]}
            demo: {type: boolean}
            served_contract_versions:
              type: array
              items: {$ref: '#/components/schemas/SemVer'}
            supported_activities:
              type: array
              items: {$ref: '#/components/schemas/Activity'}
            jurisdictions_in_scope:
              type: array
              description: Deployment scope from reference data; the contract assumes no market.
              items: {$ref: '#/components/schemas/JurisdictionCode'}
            runtime_bundle:
              type: object
              required: [bundle_state, packs, empty]
              properties:
                bundle_state: {$ref: '#/components/schemas/BundleState'}
                effective_bundle_sha256: {$ref: '#/components/schemas/Sha256'}
                empty: {type: boolean, description: True when no jurisdiction pack is loaded (CTL-DEFAULT-DENY denies every non-governance activity).}
                packs:
                  type: array
                  items: {$ref: '#/components/schemas/RuntimePack'}
            serving_registry:
              type: array
              description: Entries cleared to serve (RULESET ACTIVE or ML_MODEL APPROVED). SHADOW entries are never listed here.
              items: {$ref: '#/components/schemas/RegistryEntryRef'}
            consent_purposes:
              type: array
              items: {$ref: '#/components/schemas/ConsentPurpose'}
            channels:
              type: array
              items: {$ref: '#/components/schemas/Channel'}
            limits:
              type: object
              properties:
                max_request_bytes: {type: integer}
                max_transactions_per_evaluate: {type: integer}
                max_records_per_batch_upsert: {type: integer}
                max_part_bytes: {type: integer}
                max_page_size: {type: integer}

    # ---------------------------------------------------------------- customer outcomes
    DataWindow:
      type: object
      required: [start, end]
      properties:
        start: {type: string, format: date}
        end: {type: string, format: date}
    HealthIndicator:
      type: object
      x-ri-output-class: CUSTOMER_OUTCOME
      required: [indicator_code, band]
      properties:
        indicator_code: {$ref: '#/components/schemas/ReferenceCode'}
        value: {type: [number, string, 'null']}
        band: {$ref: '#/components/schemas/ReferenceCode'}
        evidence_window_months: {type: integer, minimum: 1, maximum: 36}
        reason_codes:
          type: array
          items: {$ref: '#/components/schemas/ReferenceCode'}
    Profile:
      type: object
      x-ri-output-class: CUSTOMER_OUTCOME
      required: [as_of, data_window, feature_set_version, features, health_indicators]
      properties:
        as_of: {$ref: '#/components/schemas/AsOf'}
        data_window: {$ref: '#/components/schemas/DataWindow'}
        feature_set_version: {$ref: '#/components/schemas/VersionLabel'}
        feature_list_sha256: {$ref: '#/components/schemas/Sha256'}
        features:
          type: object
          description: Feature dictionary values; excluded and sensitive attributes are stripped before storage and never returned.
          additionalProperties: {type: [number, string, boolean, 'null']}
        health_indicators:
          type: array
          items: {$ref: '#/components/schemas/HealthIndicator'}
        data_quality_warnings:
          type: array
          items: {$ref: '#/components/schemas/ReferenceCode'}
    InsightsResponse:
      x-ri-output-class: CUSTOMER_OUTCOME
      allOf:
        - $ref: '#/components/schemas/CustomerResponseLabels'
        - type: object
          required: [profile]
          properties:
            profile: {$ref: '#/components/schemas/Profile'}
            explanation: {$ref: '#/components/schemas/Explanation'}
    EnrichTransactionsRequest:
      type: object
      x-ri-output-class: INPUT
      additionalProperties: false
      required: [contract_version, correlation_id, jurisdiction_context, consent, subject, transactions]
      properties:
        contract_version: {$ref: '#/components/schemas/SemVer'}
        correlation_id: {$ref: '#/components/schemas/CorrelationId'}
        as_of: {$ref: '#/components/schemas/AsOf'}
        jurisdiction_context: {$ref: '#/components/schemas/JurisdictionContext'}
        consent: {$ref: '#/components/schemas/ConsentContext'}
        subject: {$ref: '#/components/schemas/SubjectIn'}
        transactions:
          type: array
          minItems: 1
          maxItems: 5000
          items: {$ref: '#/components/schemas/TransactionIn'}
    EnrichedTransaction:
      type: object
      x-ri-output-class: CUSTOMER_OUTCOME
      required: [txn_ref, txn_kind, flags]
      properties:
        txn_ref: {type: string, maxLength: 128}
        txn_kind: {type: string, enum: [PURCHASE, INCOME, TRANSFER, REFUND, REVERSAL, FEE, INTEREST, OTHER]}
        category_code: {$ref: '#/components/schemas/ReferenceCode'}
        taxonomy_version: {$ref: '#/components/schemas/VersionLabel'}
        method: {type: string, enum: [RULE, ML, HOST]}
        confidence: {type: number, minimum: 0, maximum: 1}
        rule_id: {$ref: '#/components/schemas/ReferenceCode'}
        transfer_group_ref: {type: [string, 'null']}
        related_txn_ref: {type: [string, 'null']}
        duplicate_of: {type: [string, 'null']}
        flags:
          type: object
          properties:
            recurring: {type: boolean}
            transfer: {type: boolean}
            refund: {type: boolean}
            reversal: {type: boolean}
            probable_duplicate: {type: boolean}
            pending: {type: boolean}
            excluded_from_features: {type: boolean}
    RowReject:
      type: object
      required: [index, issues]
      properties:
        index: {type: integer, minimum: 0}
        ref: {type: string, maxLength: 128}
        issues:
          type: array
          minItems: 1
          items:
            type: object
            required: [issue]
            properties:
              field: {type: string}
              issue: {type: string}
              rule_id: {$ref: '#/components/schemas/ReferenceCode'}
    EnrichTransactionsResponse:
      x-ri-output-class: CUSTOMER_OUTCOME
      allOf:
        - $ref: '#/components/schemas/CustomerResponseLabels'
        - type: object
          required: [enriched, rejects]
          properties:
            enriched:
              type: array
              items: {$ref: '#/components/schemas/EnrichedTransaction'}
            rejects:
              type: array
              items: {$ref: '#/components/schemas/RowReject'}
    SegmentMembership:
      type: object
      x-ri-output-class: CUSTOMER_OUTCOME
      required: [segment_code, segment_version, purpose, valid_from, reason_codes, source]
      properties:
        segment_code: {$ref: '#/components/schemas/ReferenceCode'}
        segment_version: {$ref: '#/components/schemas/VersionLabel'}
        purpose: {type: string, enum: [INSIGHT, COMMERCIAL]}
        valid_from: {type: string, format: date}
        valid_to: {type: [string, 'null'], format: date}
        reason_codes:
          type: array
          items: {$ref: '#/components/schemas/ReferenceCode'}
        source: {type: string, enum: [RULE, HOST]}
        origin: {type: [string, 'null'], enum: [HOST_CORE, CREDIT_PLATFORM, null]}
        decision_id: {$ref: '#/components/schemas/Identifier'}
    SegmentsResponse:
      x-ri-output-class: CUSTOMER_OUTCOME
      allOf:
        - $ref: '#/components/schemas/CustomerResponseLabels'
        - type: object
