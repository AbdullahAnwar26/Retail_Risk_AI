      x-ri-output-class: CUSTOMER_OUTCOME
      required: [reason_code]
      properties:
        reason_code: {$ref: '#/components/schemas/ReferenceCode'}
        direction: {type: string, enum: [INCREASES, DECREASES]}
        weight: {type: number}
        evidence_window_months: {type: integer, minimum: 1, maximum: 36}
    ServingModel:
      type: object
      description: Registry entry that produced the output (RULESET ACTIVE or ML_MODEL APPROVED only).
      required: [model_id, version, kind]
      properties:
        model_id: {$ref: '#/components/schemas/Identifier'}
        version: {$ref: '#/components/schemas/VersionLabel'}
        kind: {$ref: '#/components/schemas/RegistryKind'}
    ChurnScore:
      type: object
      x-ri-output-class: CUSTOMER_OUTCOME
      required: [score, band, drivers, model, horizon_days]
      properties:
        score: {type: number, minimum: 0, maximum: 1}
        band:
          type: string
          x-extensible-enum: [LOW, MEDIUM, HIGH]
          pattern: '^[A-Z][A-Z0-9_]{1,31}$'
        horizon_days: {type: integer, minimum: 1, maximum: 730}
        drivers:
          type: array
          items: {$ref: '#/components/schemas/Driver'}
        model: {$ref: '#/components/schemas/ServingModel'}
        data_window: {$ref: '#/components/schemas/DataWindow'}
    ChurnScoreResponse:
      x-ri-output-class: CUSTOMER_OUTCOME
      allOf:
        - $ref: '#/components/schemas/CustomerResponseLabels'
        - type: object
          required: [churn]
          properties:
            churn: {$ref: '#/components/schemas/ChurnScore'}
            explanation: {$ref: '#/components/schemas/Explanation'}
    Need:
      type: object
      x-ri-output-class: CUSTOMER_OUTCOME
      required: [need_code, score, band, use, drivers, evidence, rule_version]
      properties:
        need_code: {$ref: '#/components/schemas/ReferenceCode'}
        score: {type: number, minimum: 0, maximum: 1}
        band: {$ref: '#/components/schemas/ReferenceCode'}
        use: {type: string, enum: [INSIGHT, COMMERCIAL]}
        drivers:
          type: array
          items: {$ref: '#/components/schemas/Driver'}
        evidence:
          type: array
          items:
            type: object
            required: [evidence_code, window_months]
            properties:
              evidence_code: {$ref: '#/components/schemas/ReferenceCode'}
              window_months: {type: integer, minimum: 1, maximum: 36}
              value: {type: [number, string, 'null']}
        rule_version: {$ref: '#/components/schemas/VersionLabel'}
        model: {$ref: '#/components/schemas/ServingModel'}
    NeedsResponse:
      x-ri-output-class: CUSTOMER_OUTCOME
      allOf:
        - $ref: '#/components/schemas/CustomerResponseLabels'
        - type: object
          required: [needs]
          properties:
            needs:
              type: array
              items: {$ref: '#/components/schemas/Need'}
            explanation: {$ref: '#/components/schemas/Explanation'}

    # ---------------------------------------------------------------- recommendations (no credit-decision type)
    RecommendationKind:
      type: string
      description: >-
        Closed list (planning/15 §3.3). `CREDIT_REFERRAL` only means "refer to the credit platform or bank process for
        assessment" and carries no eligibility, limit, rate or likelihood. No value represents a credit approval or
        decline; adding one is forbidden by the CI forbidden-term linter.
      x-ri-output-class: CUSTOMER_OUTCOME
      enum: [PRODUCT_SUGGESTION, SERVICE_SUGGESTION, EDUCATIONAL_CONTENT, CREDIT_REFERRAL]
    RecommendationStatus:
      type: string
      x-ri-output-class: CUSTOMER_OUTCOME
      enum: [PROPOSED, SUPPRESSED, PENDING_REVIEW, SHOWN, ACCEPTED, DISMISSED_BY_CUSTOMER, OVERRIDDEN, EXPIRED]
    GateResult:
      type: object
      x-ri-output-class: CUSTOMER_OUTCOME
      required: [control_id, result]
      properties:
        control_id: {$ref: '#/components/schemas/ControlId'}
        result: {type: string, enum: [PASS, FAIL, OBLIGATION, NOT_APPLICABLE]}
        params: {type: object, additionalProperties: true}
        reason_code: {$ref: '#/components/schemas/ReferenceCode'}
    Recommendation:
      type: object
      x-ri-output-class: CUSTOMER_OUTCOME
      required: [rec_id, kind, product_code, catalogue_version, rank, status, reason_codes, gate_trace, requires_human_review, allowed_channels, decision_id]
      properties:
        rec_id: {$ref: '#/components/schemas/Identifier'}
        kind: {$ref: '#/components/schemas/RecommendationKind'}
        product_code: {$ref: '#/components/schemas/ReferenceCode'}
        catalogue_version: {$ref: '#/components/schemas/VersionLabel'}
        rank: {type: integer, minimum: 1}
        status: {$ref: '#/components/schemas/RecommendationStatus'}
        reason_codes:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/ReferenceCode'}
        gate_trace:
          type: array
          items: {$ref: '#/components/schemas/GateResult'}
        requires_human_review: {type: boolean}
        review_item_id: {type: [string, 'null']}
        allowed_channels:
          type: array
          items: {$ref: '#/components/schemas/Channel'}
        referral_target:
          type: [string, 'null']
          description: Only for CREDIT_REFERRAL - the credit platform or bank process the customer is referred to (CTL-CREDIT-REFERRAL-ONLY).
        expires_at: {type: string, format: date-time}
        decision_id: {$ref: '#/components/schemas/Identifier'}
        sharia_disclosure:
          allOf: [{$ref: '#/components/schemas/ShariaDisclosure'}]
          description: ISLAMIC deployments only (contract 1.2.0, V-9, SDC-11); see `ShariaDisclosure` and `ShariaDisclosurePresenceRule`.
    SuppressedCandidate:
      type: object
      x-ri-output-class: CUSTOMER_OUTCOME
      required: [product_code, reason_codes, decision_id]
      properties:
        rec_id: {$ref: '#/components/schemas/Identifier'}
        product_code: {$ref: '#/components/schemas/ReferenceCode'}
        kind: {$ref: '#/components/schemas/RecommendationKind'}
        reason_codes:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/ReferenceCode'}
        decision_id: {$ref: '#/components/schemas/Identifier'}
    # ---------------------------------------------------------------- Sharia disclosure (1.2.0, V-9, file 20 SDC-11)
    DocumentRef:
      type: string
      description: >-
        Opaque reference to a bank-approved document or text in the bank's library (resolved by the host or the bank's
        document service). Never free text; the subsystem never authors, parses or extracts figures from the referenced
        content (planning/20 SDC-05, SDC-08, SDC-16).
      pattern: '^[A-Za-z0-9][A-Za-z0-9_.:/-]{2,255}$'
    LocalizedDocumentRef:
      type: object
      additionalProperties: false
      required: [locale, ref]
      properties:
        locale: {$ref: '#/components/schemas/LanguageTag'}
        ref: {$ref: '#/components/schemas/DocumentRef'}
    LocalizedDocumentRefSet:
      type: array
      description: >-
        One reference per locale of the deployment profile (DEC-59; Track B `ar-AE` and `en-AE`), approved as a pair
        (planning/20 SDC-04). A disclosure that lacks a profile locale is never rendered (SDC-11; CPS 2.1.1.2 per
        file 20 row E03 [LEGAL-CONFIRM]).
      minItems: 2
      uniqueItems: true
      items: {$ref: '#/components/schemas/LocalizedDocumentRef'}
    ShariaContractType:
      description: >-
        Sharia contract structure of the catalogue item (planning/20 SDC-02; ERD `product.product_structure`). A code from
        the ISSC-approved list held as reference data, not a contract enum; the list content is [SHARIA-CONFIRM]
        (illustrative codes in file 20 SDC-02). Codes starting `CONVENTIONAL_` are invalid.
      allOf:
        - $ref: '#/components/schemas/ReferenceCode'
        - not: {pattern: '^CONVENTIONAL_'}
    ShariaDisclosureApproved:
      type: object
      description: >-
        Disclosure of a catalogue item whose Sharia approval is recorded (DEC-55): the only shape that may present an
        approved state. All references come from the catalogue item version served (no free text).
      x-ri-output-class: GOVERNANCE
      additionalProperties: false
      required: [sharia_status, sharia_approval_ref, issc_approval_ref, contract_type, sharia_basis_ref, sharia_certificate_ref, kfs_ref]
      properties:
        sharia_status: {type: string, const: SHARIA_APPROVED}
        sharia_approval_ref:
          type: string
          minLength: 1
          maxLength: 256
          description: Bank ISSC / Sharia Compliance resolution recorded through `recordPackShariaApproval` for this catalogue item version (DEC-55, SDC-01); never another institution's or the vendor's.
        issc_approval_ref:
          allOf: [{$ref: '#/components/schemas/DocumentRef'}]
          description: Customer-disclosable reference to the ISSC approval (SDC-11; CPS 2.1.1.42 per file 20 row E03 [LEGAL-CONFIRM]). Whether it may be the same reference as `sharia_approval_ref` is [SHARIA-CONFIRM].
        contract_type: {$ref: '#/components/schemas/ShariaContractType'}
        sharia_basis_ref:
          allOf: [{$ref: '#/components/schemas/LocalizedDocumentRefSet'}]
          description: Approved text of the Sharia basis (SDC-11).
        sharia_certificate_ref:
          allOf: [{$ref: '#/components/schemas/DocumentRef'}]
          description: Sharia certificate (SDC-11; SH03 CPS 11.1.1.9). Whether one reference per language is needed is [SHARIA-CONFIRM].
        kfs_ref:
          allOf: [{$ref: '#/components/schemas/LocalizedDocumentRefSet'}]
          description: Key Facts Statement, one per locale (SDC-11; E03 CPS 2.1.1.20-21). For a `CREDIT_REFERRAL` the subsystem passes only the reference and never reads or shows any amount, rate or term from it (SDC-08, SDC-16); whether a referral must link the KFS is [LEGAL-CONFIRM] (file 20 row E03 question).
        contract_consequences_ref:
          allOf: [{$ref: '#/components/schemas/LocalizedDocumentRefSet'}]
          description: Optional approved text on the contract's legal consequences (SH03 CPS 11.1.1.7-8), when the catalogue item carries one.
        education_ref:
          allOf: [{$ref: '#/components/schemas/LocalizedDocumentRefSet'}]
          description: Optional approved education text on Islamic vs conventional products (SDC-11; SH03 CPS 11.1.1.6).
        operator_sharia_approval_ref:
          allOf: [{$ref: '#/components/schemas/DocumentRef'}]
          description: Takaful items only - the Takaful operator's Sharia approval reference (SH11, SDC-13); whose ISSC approves Takaful item text is [SHARIA-CONFIRM] (file 20 SH11 question).
    ShariaDisclosureIllustrative:
      type: object
      description: >-
        Demo only: an `ILLUSTRATIVE` bundle in an `ISLAMIC` deployment (DEC-44, DEC-55; planning/21 §4.3) with a synthetic
        catalogue item whose Sharia status is not approved. Carries the activator-confirmed attribute
        `illustrative_sharia_assumption` and the notice "illustrative - not a Sharia ruling"; it has no approval
        reference and can never present an approved state. References are synthetic placeholders.
      x-ri-output-class: GOVERNANCE
      additionalProperties: false
      required: [sharia_status, illustrative_sharia_assumption, illustrative_notice, contract_type, sharia_basis_ref, sharia_certificate_ref, kfs_ref]
      properties:
        sharia_status: {type: string, enum: [NOT_REVIEWED, IN_SHARIA_REVIEW]}
        illustrative_sharia_assumption: {type: string, const: ASSUME_COMPLIANT}
        illustrative_notice: {type: string, const: illustrative - not a Sharia ruling}
        contract_type: {$ref: '#/components/schemas/ShariaContractType'}
        sharia_basis_ref: {$ref: '#/components/schemas/LocalizedDocumentRefSet'}
        sharia_certificate_ref: {$ref: '#/components/schemas/DocumentRef'}
        kfs_ref: {$ref: '#/components/schemas/LocalizedDocumentRefSet'}
        contract_consequences_ref: {$ref: '#/components/schemas/LocalizedDocumentRefSet'}
        education_ref: {$ref: '#/components/schemas/LocalizedDocumentRefSet'}
    ShariaDisclosure:
      description: >-
        Sharia basis and KFS disclosure of a suggested catalogue item (planning/20 SDC-11; planning/21 §4.4; contract
        1.2.0, V-9). Present only in `ISLAMIC` deployments, and there required on every `PRODUCT_SUGGESTION` and
        `CREDIT_REFERRAL` (optional on service and educational items); never present in `CONVENTIONAL` deployments.
        Exactly one shape: approved (`sharia_status: SHARIA_APPROVED` with `sharia_approval_ref` and
        `issc_approval_ref`), or illustrative (demo bundle only, response `illustrative: true`). An item whose disclosure
        is incomplete is never returned as a recommendation: it is suppressed with reason `SHARIA_REVIEW_PENDING`
        (`CTL-SHARIA-APPROVAL`) or `CATALOGUE_ITEM_NOT_ELIGIBLE` (`CTL-CATALOGUE-ELIGIBILITY`). Sharia content and
        disclosure wording are owned by the bank's ISSC / Sharia Compliance function [SHARIA-CONFIRM]; nothing here is a
        Sharia ruling.
      x-ri-output-class: GOVERNANCE
      oneOf:
        - $ref: '#/components/schemas/ShariaDisclosureApproved'
        - $ref: '#/components/schemas/ShariaDisclosureIllustrative'
    ShariaDisclosurePresenceRule:
      description: >-
        Applied to a recommendations container that carries `institution_type`. ISLAMIC: every `PRODUCT_SUGGESTION` and
        `CREDIT_REFERRAL` carries `sharia_disclosure`. Otherwise (CONVENTIONAL, Track A): no recommendation carries it.
      x-ri-output-class: GOVERNANCE
      if:
        required: [institution_type]
        properties: {institution_type: {const: ISLAMIC}}
      then:
        properties:
          recommendations:
            items:
              if:
                required: [kind]
                properties: {kind: {enum: [PRODUCT_SUGGESTION, CREDIT_REFERRAL]}}
              then:
                required: [sharia_disclosure]
      else:
        properties:
          recommendations:
            items:
              not: {required: [sharia_disclosure]}
    ShariaDisclosureLiveRule:
      description: Outside an `ILLUSTRATIVE` bundle every disclosure is the approved shape (no illustrative assumption in live output).
      x-ri-output-class: GOVERNANCE
      properties:
        recommendations:
          items:
            properties:
              sharia_disclosure: {$ref: '#/components/schemas/ShariaDisclosureApproved'}
    RecommendationsResponse:
      x-ri-output-class: CUSTOMER_OUTCOME
      allOf:
        - $ref: '#/components/schemas/CustomerResponseLabels'
        - type: object
          required: [recommendations, suppressed, institution_type]
          properties:
            institution_type: {$ref: '#/components/schemas/InstitutionType'}
            recommendations:
              type: array
              items: {$ref: '#/components/schemas/Recommendation'}
            suppressed:
              type: array
              items: {$ref: '#/components/schemas/SuppressedCandidate'}
            explanation: {$ref: '#/components/schemas/Explanation'}
        - $ref: '#/components/schemas/ShariaDisclosurePresenceRule'
        - if:
            properties: {illustrative: {const: false}}
          then: {$ref: '#/components/schemas/ShariaDisclosureLiveRule'}
    ReviewResultReport:
      type: object
      description: Plugin human-review result for a flagged item (planning/07 review_item rules).
      x-ri-output-class: INPUT
      additionalProperties: false
      required: [report_type, review_result, reviewer_ref, occurred_at]
      properties:
        report_type: {type: string, const: REVIEW_RESULT}
        review_result: {type: string, enum: [CLEARED_TO_SHOW, REJECTED, ESCALATED, EXPIRED]}
        reason_code: {$ref: '#/components/schemas/ReferenceCode'}
        reviewer_ref: {$ref: '#/components/schemas/Token'}
        occurred_at: {type: string, format: date-time}
        correlation_id: {$ref: '#/components/schemas/CorrelationId'}
        contract_version: {$ref: '#/components/schemas/SemVer'}
      allOf:
        - if:
            properties: {review_result: {enum: [REJECTED, ESCALATED]}}
          then:
            required: [reason_code]
    RecommendationCustomerOutcome:
      type: object
      x-ri-output-class: INPUT
      additionalProperties: false
      required: [report_type, outcome, occurred_at, source]
      properties:
        report_type: {type: string, const: CUSTOMER_OUTCOME}
        outcome: {type: string, enum: [SHOWN, ACCEPTED, DISMISSED_BY_CUSTOMER, OVERRIDDEN]}
        reason_code: {$ref: '#/components/schemas/ReferenceCode'}
        occurred_at: {type: string, format: date-time}
        source: {type: string, enum: [HOST, STAFF]}
        channel: {$ref: '#/components/schemas/Channel'}
        correlation_id: {$ref: '#/components/schemas/CorrelationId'}
        contract_version: {$ref: '#/components/schemas/SemVer'}
      allOf:
        - if:
            properties: {outcome: {const: OVERRIDDEN}}
          then:
            required: [reason_code]
    RecommendationOutcomeRequest:
      x-ri-output-class: INPUT
      oneOf:
        - $ref: '#/components/schemas/RecommendationCustomerOutcome'
        - $ref: '#/components/schemas/ReviewResultReport'
      discriminator:
        propertyName: report_type
        mapping:
          CUSTOMER_OUTCOME: '#/components/schemas/RecommendationCustomerOutcome'
          REVIEW_RESULT: '#/components/schemas/ReviewResultReport'
    OutcomeReceipt:
      x-ri-output-class: CUSTOMER_OUTCOME
      allOf:
        - $ref: '#/components/schemas/ResponseLabels'
        - type: object
          required: [outcome_id, item_id, recorded_at, permitted_use]
          properties:
            outcome_id: {$ref: '#/components/schemas/Identifier'}
            item_id: {$ref: '#/components/schemas/Identifier'}
            recorded_at: {type: string, format: date-time}
            item_status: {type: string, description: Status of the recommendation or retention action after the report.}
            review_item_state: {$ref: '#/components/schemas/ReviewState'}
            permitted_use: {$ref: '#/components/schemas/PermittedUse'}

    # ---------------------------------------------------------------- retention
    ContactConstraints:
      type: object
      description: Effective CTL-CONTACT-LIMIT result (most restrictive of pack params and host preferences).
      properties:
        max_per_window: {type: integer, minimum: 0}
        window: {type: string, pattern: '^P([0-9]+D|[0-9]+W)$'}
        quiet_hours:
          type: array
          items: {$ref: '#/components/schemas/QuietHours'}
        next_contact_not_before: {type: [string, 'null'], format: date-time}
    RetentionAction:
      type: object
      x-ri-output-class: CUSTOMER_OUTCOME
      required: [action_id, action_type, priority, status, reason_codes, requires_human_review, decision_id]
      properties:
        action_id: {$ref: '#/components/schemas/Identifier'}
        action_type:
          type: string
          description: Fixed playbook action code (BQ-6); reference data.
          pattern: '^RA_[A-Z0-9_]{2,60}$'
        priority: {type: integer, minimum: 1}
        status: {type: string, enum: [PROPOSED, SUPPRESSED, PENDING_REVIEW, SHOWN, ACTIONED, EXPIRED]}
        reason_codes:
          type: array
          items: {$ref: '#/components/schemas/ReferenceCode'}
        requires_human_review: {type: boolean}
        review_item_id: {type: [string, 'null']}
        assigned_role: {$ref: '#/components/schemas/ReviewerRole'}
        trigger_prediction_id: {$ref: '#/components/schemas/Identifier'}
        allowed_channels:
          type: array
          items: {$ref: '#/components/schemas/Channel'}
        contact_constraints: {$ref: '#/components/schemas/ContactConstraints'}
        expires_at: {type: string, format: date-time}
        decision_id: {$ref: '#/components/schemas/Identifier'}
    RetentionActionsResponse:
      x-ri-output-class: CUSTOMER_OUTCOME
      allOf:
        - $ref: '#/components/schemas/CustomerResponseLabels'
        - type: object
          required: [actions]
          properties:
            actions:
              type: array
              items: {$ref: '#/components/schemas/RetentionAction'}
            explanation: {$ref: '#/components/schemas/Explanation'}
    RetentionOutcomeReport:
      type: object
      x-ri-output-class: INPUT
      additionalProperties: false
      required: [report_type, outcome, outcome_reason, outcome_at, outcome_source]
      properties:
        report_type: {type: string, const: RETENTION_OUTCOME}
        outcome: {type: string, enum: [NOT_ACTIONED, CONTACTED, RETAINED, CLOSED, UNKNOWN]}
        outcome_reason: {$ref: '#/components/schemas/ReferenceCode'}
        outcome_at: {type: string, format: date-time}
        outcome_source: {type: string, enum: [HOST, STAFF]}
        reported_by: {$ref: '#/components/schemas/Token'}
        correlation_id: {$ref: '#/components/schemas/CorrelationId'}
        contract_version: {$ref: '#/components/schemas/SemVer'}
    RetentionOutcomeRequest:
      x-ri-output-class: INPUT
      oneOf:
        - $ref: '#/components/schemas/RetentionOutcomeReport'
        - $ref: '#/components/schemas/ReviewResultReport'
      discriminator:
        propertyName: report_type
        mapping:
          RETENTION_OUTCOME: '#/components/schemas/RetentionOutcomeReport'
          REVIEW_RESULT: '#/components/schemas/ReviewResultReport'

    # ---------------------------------------------------------------- human review
    ReviewItem:
      type: object
      x-ri-output-class: CUSTOMER_OUTCOME
      required: [review_item_id, item_type, item_id, customer_token, decision_id, trigger_control, required_role, state, sla_due_at, created_at]
      properties:
        review_item_id: {$ref: '#/components/schemas/Identifier'}
        item_type: {type: string, enum: [RECOMMENDATION, RETENTION_ACTION, EXPLANATION_TEMPLATE]}
        item_id: {$ref: '#/components/schemas/Identifier'}
        customer_token: {$ref: '#/components/schemas/Token'}
        decision_id: {$ref: '#/components/schemas/Identifier'}
        trigger_control: {$ref: '#/components/schemas/ControlId'}
        required_role: {$ref: '#/components/schemas/ReviewerRole'}
        state: {$ref: '#/components/schemas/ReviewState'}
        reason_code: {$ref: '#/components/schemas/ReferenceCode'}
        reviewer_ref: {type: [string, 'null']}
        sla_due_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        decided_at: {type: [string, 'null'], format: date-time}
    ReviewItemResponse:
      x-ri-output-class: CUSTOMER_OUTCOME
      allOf:
        - $ref: '#/components/schemas/ResponseLabels'
        - type: object
          required: [review_item, permitted_use]
          properties:
