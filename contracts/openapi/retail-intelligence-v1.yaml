  # ------------------------------------------------------------------ Human review
  /v1/portfolio/summary:
    get:
      tags: [Portfolio]
      operationId: getPortfolioSummary
      summary: Aggregate-only portfolio summary
      description: >-
        Counts by one dimension (segment, churn band, need, retention action or jurisdiction) for the portfolio view
        (S11, Story 9.7). Aggregate-only: no customer token, no personal data and no per-customer value. Any count below
        the deployment's `min_cell_size` (config, default 20 [ASSUME]; a floor that config may raise, never lower) is
        returned as `count: null` with `suppressed: true`; complementary suppression prevents recovering a suppressed
        cell from totals or from another dimension. Aggregate disclosure control (planning/21 §10A, AG-1..AG-10): one
        fixed dimension per call, no cross-tabulation or free filter; `jurisdiction` accepts only a data-cell root from
        reference data (else 400); `as_of` must be a published snapshot date (else 400); published counts are rounded
        to the configured rounding base (default 5 [ASSUME]) and no total is returned; every call is audited and a
        per-user daily quota applies (429). Minors, age-unknown and consent-withdrawn customers are excluded from
        commercial dimensions. Rows are limited to the caller's `ri_jurisdictions` claim (ROW_FILTER). In a deployment
        with several data cells (planning/21 §2) each cell suppresses and rounds its own aggregates first; only those
        outputs are combined (a code suppressed in any cell stays suppressed), and no component reads another cell's
        store. Never across tracks (DEC-52, DEC-53).
      x-activity: SEGMENTATION_INSIGHT
      parameters:
        - name: dimension
          in: query
          required: true
          description: Aggregation dimension.
          schema: {$ref: '#/components/schemas/PortfolioDimension'}
        - name: jurisdiction
          in: query
          required: false
          description: Restrict to one jurisdiction subtree (must lie inside the claim).
          schema: {$ref: '#/components/schemas/JurisdictionCode'}
        - $ref: '#/components/parameters/AsOfQuery'
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - $ref: '#/components/parameters/TraceparentHeader'
        - $ref: '#/components/parameters/XContractVersionHeader'
        - $ref: '#/components/parameters/XOnBehalfOfHeader'
      security:
        - oidc: [ri.portfolio.read]
        - oauth2: [ri.portfolio.read]
      responses:
        '200':
          description: Aggregate counts with small cells suppressed.
          headers:
            X-Correlation-Id: {$ref: '#/components/headers/XCorrelationId'}
            X-Contract-Version: {$ref: '#/components/headers/XContractVersion'}
            X-Not-For-Credit-Decisioning: {$ref: '#/components/headers/XNotForCreditDecisioning'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PortfolioSummaryResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '412': {$ref: '#/components/responses/ContractVersionUnsupported'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /v1/review-items:
    get:
      tags: [Human review]
      operationId: listReviewItems
      summary: List review items
      description: >-
        Work queue of review items (operational access, not a customer directory): only customers with an item raised
        by `CTL-HUMAN-REVIEW` or `CTL-VULNERABILITY-ROUTE` appear, filtered by the `ri_jurisdictions` claim (ROW_FILTER).
        From contract 1.2.0 (V-8, DEC-68) every call writes an `audit_record` with an `access` block (access kind
        `QUEUE`, filters, result count, outcome), as for `searchCustomerDirectory`.
      parameters:
        - name: state
          in: query
          required: false
          description: Filter by review state.
          schema: {$ref: '#/components/schemas/ReviewState'}
        - name: role
          in: query
          required: false
          description: Filter by required reviewer role.
          schema: {$ref: '#/components/schemas/ReviewerRole'}
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/CursorQuery'
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - $ref: '#/components/parameters/TraceparentHeader'
        - $ref: '#/components/parameters/XContractVersionHeader'
        - $ref: '#/components/parameters/XOnBehalfOfHeader'
      security:
        - oidc: [ri.review.read]
        - oauth2: [ri.review.read]
      responses:
        '200':
          description: Page of review items ordered by (created_at, review_item_id).
          headers:
            X-Correlation-Id: {$ref: '#/components/headers/XCorrelationId'}
            X-Contract-Version: {$ref: '#/components/headers/XContractVersion'}
            X-Not-For-Credit-Decisioning: {$ref: '#/components/headers/XNotForCreditDecisioning'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReviewItemPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /v1/review-items/{review_item_id}:transition:
    post:
      tags: [Human review]
      operationId: transitionReviewItem
      summary: Move a review item to its next state
      description: >-
        QUEUED -> IN_REVIEW -> CLEARED_TO_SHOW / REJECTED / ESCALATED; ESCALATED -> IN_REVIEW. EXPIRED and CANCELLED
        are set by the system only. Reason code mandatory on REJECTED and ESCALATED. The reviewer must differ from the
        requesting service or user (`MAKER_CHECKER_VIOLATION`). Only CLEARED_TO_SHOW releases the output. A review item
        whose parent recommendation is suppressed (offer-suppression confirmation, DEC-66) can end only as REJECTED
        (suppression confirmed) or ESCALATED; CLEARED_TO_SHOW is refused with 409 `REVIEW_STATE_INVALID` and the
        suppression stands (planning/21 §11A).
      parameters:
        - $ref: '#/components/parameters/ReviewItemIdPath'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - $ref: '#/components/parameters/TraceparentHeader'
        - $ref: '#/components/parameters/XContractVersionHeader'
        - $ref: '#/components/parameters/XOnBehalfOfHeader'
      security:
        - oidc: [ri.review.write]
        - oauth2: [ri.review.write]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReviewTransitionRequest'}
      responses:
        '200':
          description: Review item after the transition.
          headers:
            X-Correlation-Id: {$ref: '#/components/headers/XCorrelationId'}
            X-Contract-Version: {$ref: '#/components/headers/XContractVersion'}
            X-Not-For-Credit-Decisioning: {$ref: '#/components/headers/XNotForCreditDecisioning'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReviewItemResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}

  # ------------------------------------------------------------------ Explanations and assistant
  /v1/explanations/{result_id}:
    get:
      tags: [Explanations]
      operationId: getExplanation
      summary: Plain-language explanation of a prior result
      description: Template text by default; LLM wording only where CTL-LLM-GUARDRAIL allows, with every number verified against tool results and template fallback. The original result's jurisdiction context and purpose are reused for the EXPLANATION_GENERATION decision.
      x-activity: EXPLANATION_GENERATION
      parameters:
        - $ref: '#/components/parameters/ResultIdPath'
        - name: language
          in: query
          required: false
          description: BCP 47 language tag; must be in the languages allowed by CTL-EXPLANATION.
          schema: {$ref: '#/components/schemas/LanguageTag'}
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - $ref: '#/components/parameters/TraceparentHeader'
        - $ref: '#/components/parameters/XContractVersionHeader'
        - $ref: '#/components/parameters/XOnBehalfOfHeader'
      security:
        - oidc: [ri.explanations.read]
        - oauth2: [ri.explanations.read]
      responses:
        '200':
          description: Explanation.
          headers:
            X-Correlation-Id: {$ref: '#/components/headers/XCorrelationId'}
            X-Contract-Version: {$ref: '#/components/headers/XContractVersion'}
            X-Not-For-Credit-Decisioning: {$ref: '#/components/headers/XNotForCreditDecisioning'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExplanationResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /v1/assistant/messages:
    post:
      tags: [Assistant]
      operationId: postAssistantMessage
      summary: Staff Q&A over tool results (read-only)
      description: Uses only the typed, read-only M9 tool layer. Requests for credit approval or decline, account changes, unknown products or legal conclusions return 422 `OUT_OF_SCOPE_REQUEST` with a handoff message (CTL-ADVERSE-ACTION-HANDOFF).
      x-activity: ASSISTANT_QA
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - $ref: '#/components/parameters/TraceparentHeader'
        - $ref: '#/components/parameters/XContractVersionHeader'
        - $ref: '#/components/parameters/XOnBehalfOfHeader'
      security:
        - oidc: [ri.assistant.use]
        - oauth2: [ri.assistant.use]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AssistantMessageRequest'}
      responses:
        '200':
          description: Answer grounded in tool results.
          headers:
            X-Correlation-Id: {$ref: '#/components/headers/XCorrelationId'}
            X-Contract-Version: {$ref: '#/components/headers/XContractVersion'}
            X-Not-For-Credit-Decisioning: {$ref: '#/components/headers/XNotForCreditDecisioning'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AssistantAnswerResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  # ------------------------------------------------------------------ Policy decisions
  /v1/policy/decisions:
    post:
      tags: [Policy decisions]
      operationId: queryPolicyDecision
      summary: Would an activity be permitted for this context? (dry run)
      description: Processes no customer data. Outcomes are PERMIT, PERMIT_WITH_OBLIGATIONS or DENY; INDETERMINATE is never returned (enforced as DENY with `POLICY_INDETERMINATE`). An unknown activity is DENY. Reason codes reference policy IDs and statuses only, never a legal conclusion.
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - $ref: '#/components/parameters/TraceparentHeader'
        - $ref: '#/components/parameters/XContractVersionHeader'
      security:
        - oidc: [ri.policy.query]
        - oauth2: [ri.policy.query]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PolicyDecisionQueryRequest'}
            examples:
              push:
                $ref: '#/components/examples/PolicyDecisionQueryExample'
      responses:
        '200':
          description: Decision (also written to the decision log).
          headers:
            X-Correlation-Id: {$ref: '#/components/headers/XCorrelationId'}
            X-Contract-Version: {$ref: '#/components/headers/XContractVersion'}
            X-Not-For-Credit-Decisioning: {$ref: '#/components/headers/XNotForCreditDecisioning'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PolicyDecisionQueryResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /v1/policy/decisions/{decision_id}:
    get:
      tags: [Policy decisions]
      operationId: getDecisionLogRecord
      summary: Read a decision-log record
      description: Record per planning/14 §7 (packs, bundle_state, policy hits, outcome, obligations, reason codes). No PII.
      parameters:
        - $ref: '#/components/parameters/DecisionIdPath'
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - $ref: '#/components/parameters/TraceparentHeader'
        - $ref: '#/components/parameters/XContractVersionHeader'
      security:
        - oidc: [ri.audit.export]
        - oauth2: [ri.audit.export]
      responses:
        '200':
          description: Decision-log record.
          headers:
            X-Correlation-Id: {$ref: '#/components/headers/XCorrelationId'}
            X-Contract-Version: {$ref: '#/components/headers/XContractVersion'}
            X-Not-For-Credit-Decisioning: {$ref: '#/components/headers/XNotForCreditDecisioning'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DecisionLogRecordResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /v1/policy/decisions/{decision_id}:replay:
    post:
      tags: [Policy decisions]
      operationId: replayDecision
      summary: Replay a decision with its recorded pack versions and as_of
      description: Writes nothing but an audit record. For a crypto-shredded subject the inputs are gone and the call returns 422 `DATA_QUALITY_INSUFFICIENT` with reason `SUBJECT_ERASED`.
      parameters:
        - $ref: '#/components/parameters/DecisionIdPath'
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - $ref: '#/components/parameters/TraceparentHeader'
        - $ref: '#/components/parameters/XContractVersionHeader'
      security:
        - oidc: [ri.audit.export]
        - oauth2: [ri.audit.export]
      responses:
        '200':
          description: Replay result.
          headers:
            X-Correlation-Id: {$ref: '#/components/headers/XCorrelationId'}
            X-Contract-Version: {$ref: '#/components/headers/XContractVersion'}
            X-Not-For-Credit-Decisioning: {$ref: '#/components/headers/XNotForCreditDecisioning'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DecisionReplayResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/RateLimited'}

  # ------------------------------------------------------------------ Policy governance (DEC-45, DEC-46)
  /v1/policy/packs:
    get:
      tags: [Policy governance]
      operationId: listPolicyPacks
      summary: List pack manifests
      description: Default filter is the runtime bundle (packs in ACTIVE or ILLUSTRATIVE state plus L0).
      parameters:
        - name: state
          in: query
          required: false
          description: Filter by pack state; omit for the runtime bundle.
          schema: {$ref: '#/components/schemas/PackState'}
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/CursorQuery'
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - $ref: '#/components/parameters/TraceparentHeader'
        - $ref: '#/components/parameters/XContractVersionHeader'
      security:
        - oidc: [ri.policy.read]
        - oauth2: [ri.policy.read]
      responses:
        '200':
          description: Page of pack summaries.
          headers:
            X-Correlation-Id: {$ref: '#/components/headers/XCorrelationId'}
            X-Contract-Version: {$ref: '#/components/headers/XContractVersion'}
            X-Not-For-Credit-Decisioning: {$ref: '#/components/headers/XNotForCreditDecisioning'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PackSummaryPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    post:
      tags: [Policy governance]
      operationId: uploadPolicyPack
      summary: Upload a candidate pack (creates DRAFT)
      description: Uploads a YAML bundle and manifest. The pack is created in DRAFT and the caller is recorded as maker.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - $ref: '#/components/parameters/TraceparentHeader'
        - $ref: '#/components/parameters/XContractVersionHeader'
        - $ref: '#/components/parameters/XOnBehalfOfHeader'
      security:
        - oidc: [ri.policy.author]
        - oauth2: [ri.policy.author]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: '#/components/schemas/PackUploadForm'}
      responses:
        '201':
          description: Pack created in DRAFT.
          headers:
            Location: {$ref: '#/components/headers/Location'}
            X-Correlation-Id: {$ref: '#/components/headers/XCorrelationId'}
            X-Contract-Version: {$ref: '#/components/headers/XContractVersion'}
            X-Not-For-Credit-Decisioning: {$ref: '#/components/headers/XNotForCreditDecisioning'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PackStatusResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /v1/policy/packs/{pack_id}/{version}:
    get:
      tags: [Policy governance]
      operationId: getPolicyPackStatus
      summary: Pack status view
      description: pack_state, per-policy approval and applicability status, illustrative assumptions, validation and simulator report refs, approver_assigned, sign-off refs, activation and state history.
      parameters:
        - $ref: '#/components/parameters/PackIdPath'
        - $ref: '#/components/parameters/PackVersionPath'
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - $ref: '#/components/parameters/TraceparentHeader'
        - $ref: '#/components/parameters/XContractVersionHeader'
      security:
        - oidc: [ri.policy.read]
        - oauth2: [ri.policy.read]
      responses:
        '200':
          description: Pack status.
          headers:
            X-Correlation-Id: {$ref: '#/components/headers/XCorrelationId'}
            X-Contract-Version: {$ref: '#/components/headers/XContractVersion'}
            X-Not-For-Credit-Decisioning: {$ref: '#/components/headers/XNotForCreditDecisioning'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PackStatusResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /v1/policy/packs/{pack_id}/{version}:validate:
    post:
      tags: [Policy governance]
      operationId: validatePolicyPack
      summary: Validate a pack (DRAFT -> VALIDATED on pass)
      description: Runs schema, invariants, golden cases and monotonicity. On pass the build signs the manifest and the pack becomes VALIDATED (loaded but unapproved, simulator only). The report is returned on pass and fail.
      parameters:
        - $ref: '#/components/parameters/PackIdPath'
        - $ref: '#/components/parameters/PackVersionPath'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - $ref: '#/components/parameters/TraceparentHeader'
        - $ref: '#/components/parameters/XContractVersionHeader'
        - $ref: '#/components/parameters/XOnBehalfOfHeader'
      security:
        - oidc: [ri.policy.author]
        - oauth2: [ri.policy.author]
      responses:
        '200':
          description: Validation report.
          headers:
            X-Correlation-Id: {$ref: '#/components/headers/XCorrelationId'}
            X-Contract-Version: {$ref: '#/components/headers/XContractVersion'}
            X-Not-For-Credit-Decisioning: {$ref: '#/components/headers/XNotForCreditDecisioning'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PackValidationReportResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /v1/policy/packs/{pack_id}/{version}:submit:
    post:
      tags: [Policy governance]
      operationId: submitPolicyPack
      summary: Submit a VALIDATED pack for legal review (VALIDATED -> IN_LEGAL_REVIEW)
      description: >-
        Refused without a completed simulator report (`simulation_id`) produced against the current runtime bundle (409
        `PACK_STATE_INVALID`). In an `ISLAMIC` deployment (planning/21 §4.3; 1.1.1) the same audited step also moves the
        overlay policies and the released Track B artefacts in the submission (catalogue items, templates, reason-code
        texts) from `NOT_REVIEWED` to `IN_SHARIA_REVIEW`; the outcome is recorded with `recordPackShariaApproval`. In a
        `CONVENTIONAL` deployment the Sharia state is not touched.
      parameters:
        - $ref: '#/components/parameters/PackIdPath'
        - $ref: '#/components/parameters/PackVersionPath'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - $ref: '#/components/parameters/TraceparentHeader'
        - $ref: '#/components/parameters/XContractVersionHeader'
        - $ref: '#/components/parameters/XOnBehalfOfHeader'
      security:
        - oidc: [ri.policy.author]
        - oauth2: [ri.policy.author]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PackSubmitRequest'}
      responses:
        '200':
          description: Pack status after submission.
          headers:
            X-Correlation-Id: {$ref: '#/components/headers/XCorrelationId'}
            X-Contract-Version: {$ref: '#/components/headers/XContractVersion'}
            X-Not-For-Credit-Decisioning: {$ref: '#/components/headers/XNotForCreditDecisioning'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PackStatusResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /v1/policy/packs/{pack_id}/{version}/approvals:
    post:
      tags: [Policy governance]
      operationId: recordPackApproval
      summary: Per-policy maker-checker decision
      description: >-
        Approver must differ from the maker (409 `MAKER_CHECKER_VIOLATION`). Policies with `illustrative: true` cannot
        be approved (422 `ILLUSTRATIVE_NOT_APPROVABLE`). Only the approver sets `applicability_status`. The pack becomes
        APPROVED when every member policy is approved. While DEC-11 is unresolved no user holds `ri.policy.approve`, so
        every call returns 403 and the pack status shows `approver_assigned: false`. This is a governance schema, outside
        the forbidden-term linter's output scope (planning/15 §3.3).
      parameters:
        - $ref: '#/components/parameters/PackIdPath'
        - $ref: '#/components/parameters/PackVersionPath'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - $ref: '#/components/parameters/TraceparentHeader'
        - $ref: '#/components/parameters/XContractVersionHeader'
        - $ref: '#/components/parameters/XOnBehalfOfHeader'
      security:
        - oidc: [ri.policy.approve]
        - oauth2: [ri.policy.approve]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PackApprovalRequest'}
      responses:
        '201':
          description: Approval record created.
          headers:
            X-Correlation-Id: {$ref: '#/components/headers/XCorrelationId'}
            X-Contract-Version: {$ref: '#/components/headers/XContractVersion'}
            X-Not-For-Credit-Decisioning: {$ref: '#/components/headers/XNotForCreditDecisioning'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PackApprovalRecordResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /v1/policy/packs/{pack_id}/{version}/sharia-approvals:
    post:
      tags: [Policy governance]
      operationId: recordPackShariaApproval
      summary: Sharia approval record (institution type ISLAMIC only)
      description: >-
        Records the Sharia Compliance / ISSC decision (DEC-55) on member policies of a pack and on the catalogue
        items, templates and reason-code texts released with it. Only in deployments whose profile has
        `institution_type: ISLAMIC`; elsewhere 422 `OUT_OF_SCOPE_REQUEST`. The Sharia approver must differ from the
        maker and from the legal approver of the same pack version (409 `MAKER_CHECKER_VIOLATION`; SOD-9, planning/21
        §4.3); every record is written to the hash-chained audit log; illustrative policies cannot be approved (422
        `ILLUSTRATIVE_NOT_APPROVABLE`). In an `ISLAMIC` deployment a pack becomes APPROVED only when every member
        policy has both the legal approval (`recordPackApproval`) and `SHARIA_APPROVED`; otherwise customer-facing
        use stays BLOCK with reason `SHARIA_REVIEW_PENDING` (reference data). While no named Sharia approver is
        recorded (DEC-63) no user holds `ri.sharia.approve`, so every call returns 403. Governance schema, outside
        the forbidden-term linter's output scope (planning/15 §3.3).
      parameters:
        - $ref: '#/components/parameters/PackIdPath'
        - $ref: '#/components/parameters/PackVersionPath'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - $ref: '#/components/parameters/TraceparentHeader'
        - $ref: '#/components/parameters/XContractVersionHeader'
        - $ref: '#/components/parameters/XOnBehalfOfHeader'
      security:
        - oidc: [ri.sharia.approve]
        - oauth2: [ri.sharia.approve]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ShariaApprovalRequest'}
      responses:
        '201':
          description: Sharia approval record created.
          headers:
            X-Correlation-Id: {$ref: '#/components/headers/XCorrelationId'}
            X-Contract-Version: {$ref: '#/components/headers/XContractVersion'}
            X-Not-For-Credit-Decisioning: {$ref: '#/components/headers/XNotForCreditDecisioning'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShariaApprovalRecordResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /v1/policy/packs/{pack_id}/{version}/activations:
    post:
      tags: [Policy governance]
      operationId: activatePolicyPack
      summary: Activate a pack as ACTIVE or (demo only) ILLUSTRATIVE
      description: >-
        ACTIVE needs pack state APPROVED plus recorded MGR/LEG sign-off refs. ILLUSTRATIVE needs a VALIDATED pack whose
        policies are all `illustrative: true`, in a deployment with mode STANDALONE, `demo = true` and the
        synthetic-only guard on (else 409 `ILLUSTRATIVE_NOT_PERMITTED`); the activator confirms each
        `illustrative_assumption` (DEC-44 second-user check). Activator differs from maker. Rollback = activating an
        earlier version; the replaced version becomes RETIRED. Emits `policy.pack.activated`.
      parameters:
        - $ref: '#/components/parameters/PackIdPath'
        - $ref: '#/components/parameters/PackVersionPath'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - $ref: '#/components/parameters/TraceparentHeader'
        - $ref: '#/components/parameters/XContractVersionHeader'
        - $ref: '#/components/parameters/XOnBehalfOfHeader'
      security:
        - oidc: [ri.policy.release]
        - oauth2: [ri.policy.release]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PackActivationRequest'}
      responses:
        '201':
          description: Activation record created.
          headers:
            X-Correlation-Id: {$ref: '#/components/headers/XCorrelationId'}
            X-Contract-Version: {$ref: '#/components/headers/XContractVersion'}
            X-Not-For-Credit-Decisioning: {$ref: '#/components/headers/XNotForCreditDecisioning'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PackActivationRecordResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}

  # ------------------------------------------------------------------ Simulator
  /v1/policy/simulations:
    post:
      tags: [Policy simulator]
      operationId: startPolicySimulation
      summary: Start an asynchronous simulation run
      description: >-
        Candidate pack (any state except RETIRED) versus the current runtime bundle over golden cases and the
        synthetic population (synthetic data only). A run whose candidate hits PENDING_LEGAL_REVIEW policies writes an
        audit record and emits `policy.review.required` with `source: SIMULATION`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - $ref: '#/components/parameters/TraceparentHeader'
        - $ref: '#/components/parameters/XContractVersionHeader'
        - $ref: '#/components/parameters/XOnBehalfOfHeader'
      security:
        - oidc: [ri.policy.simulate]
        - oauth2: [ri.policy.simulate]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SimulationRequest'}
      responses:
        '202':
          description: Simulation accepted.
          headers:
            Location: {$ref: '#/components/headers/Location'}
            X-Correlation-Id: {$ref: '#/components/headers/XCorrelationId'}
            X-Contract-Version: {$ref: '#/components/headers/XContractVersion'}
            X-Not-For-Credit-Decisioning: {$ref: '#/components/headers/XNotForCreditDecisioning'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SimulationResultResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /v1/policy/simulations/{simulation_id}:
    get:
      tags: [Policy simulator]
      operationId: getPolicySimulation
      summary: Simulation status and diff report
      parameters:
        - $ref: '#/components/parameters/SimulationIdPath'
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - $ref: '#/components/parameters/TraceparentHeader'
        - $ref: '#/components/parameters/XContractVersionHeader'
      security:
        - oidc: [ri.policy.simulate]
        - oauth2: [ri.policy.simulate]
        - oidc: [ri.policy.read]
        - oauth2: [ri.policy.read]
      responses:
        '200':
          description: Simulation result (status may still be QUEUED or RUNNING).
          headers:
            X-Correlation-Id: {$ref: '#/components/headers/XCorrelationId'}
            X-Contract-Version: {$ref: '#/components/headers/XContractVersion'}
            X-Not-For-Credit-Decisioning: {$ref: '#/components/headers/XNotForCreditDecisioning'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SimulationResultResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}

  # ------------------------------------------------------------------ Host overlay
  /v1/policy/overlays/{overlay_id}:
    put:
      tags: [Host overlay]
      operationId: putHostOverlay
      summary: Supply a signed, stricter-only host overlay (plugin)
      description: Merged with the same combining rules; the host can only add or tighten. Loosening parts are rejected, reported in the response and emitted as `policy.overlay.rejected`. Unsigned overlays are refused (400).
      parameters:
        - $ref: '#/components/parameters/OverlayIdPath'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - $ref: '#/components/parameters/TraceparentHeader'
        - $ref: '#/components/parameters/XContractVersionHeader'
      security:
        - oidc: [ri.policy.overlay.write]
        - oauth2: [ri.policy.overlay.write]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HostOverlayRequest'}
      responses:
        '200':
          description: Overlay merged; rejected parts listed.
          headers:
            X-Correlation-Id: {$ref: '#/components/headers/XCorrelationId'}
            X-Contract-Version: {$ref: '#/components/headers/XContractVersion'}
            X-Not-For-Credit-Decisioning: {$ref: '#/components/headers/XNotForCreditDecisioning'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HostOverlayResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}

  # ------------------------------------------------------------------ Model registry (DEC-47)
  /v1/models:
    get:
      tags: [Model registry]
      operationId: listModels
      summary: List registry entries
      description: Aggregate data only; never customer-level SHADOW outputs.
      parameters:
        - name: kind
          in: query
          required: false
          description: Filter by registry kind.
          schema: {$ref: '#/components/schemas/RegistryKind'}
        - name: status
          in: query
          required: false
          description: Filter by registry status.
          schema: {$ref: '#/components/schemas/RegistryStatus'}
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/CursorQuery'
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - $ref: '#/components/parameters/TraceparentHeader'
        - $ref: '#/components/parameters/XContractVersionHeader'
      security:
        - oidc: [ri.models.read]
        - oauth2: [ri.models.read]
      responses:
        '200':
          description: Page of registry entries.
          headers:
            X-Correlation-Id: {$ref: '#/components/headers/XCorrelationId'}
            X-Contract-Version: {$ref: '#/components/headers/XContractVersion'}
            X-Not-For-Credit-Decisioning: {$ref: '#/components/headers/XNotForCreditDecisioning'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModelVersionPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /v1/models/{model_id}/versions/{version}:
    get:
      tags: [Model registry]
      operationId: getModelVersion
      summary: Read one registry entry
      parameters:
        - $ref: '#/components/parameters/ModelIdPath'
        - $ref: '#/components/parameters/ModelVersionPath'
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - $ref: '#/components/parameters/TraceparentHeader'
        - $ref: '#/components/parameters/XContractVersionHeader'
      security:
        - oidc: [ri.models.read]
        - oauth2: [ri.models.read]
      responses:
        '200':
          description: Registry entry.
          headers:
            X-Correlation-Id: {$ref: '#/components/headers/XCorrelationId'}
            X-Contract-Version: {$ref: '#/components/headers/XContractVersion'}
            X-Not-For-Credit-Decisioning: {$ref: '#/components/headers/XNotForCreditDecisioning'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModelVersionResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /v1/models/{model_id}/versions/{version}:transition:
    post:
      tags: [Model registry]
      operationId: transitionModelVersion
      summary: Change a registry entry's status
      description: >-
        RULESET: DRAFT -> ACTIVE -> RETIRED. ML_MODEL: DRAFT -> SHADOW -> RETIRED; -> APPROVED needs an MRM approval
        reference and is refused while DEC-19 is unresolved (409 `MODEL_APPROVAL_UNAVAILABLE`). Emits
        `model.status_changed`. Governance schema, outside the forbidden-term linter's output scope.
      parameters:
        - $ref: '#/components/parameters/ModelIdPath'
        - $ref: '#/components/parameters/ModelVersionPath'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - $ref: '#/components/parameters/TraceparentHeader'
        - $ref: '#/components/parameters/XContractVersionHeader'
        - $ref: '#/components/parameters/XOnBehalfOfHeader'
      security:
        - oidc: [ri.models.write]
        - oauth2: [ri.models.write]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ModelTransitionRequest'}
      responses:
        '200':
          description: Registry entry after the transition.
          headers:
            X-Correlation-Id: {$ref: '#/components/headers/XCorrelationId'}
            X-Contract-Version: {$ref: '#/components/headers/XContractVersion'}
            X-Not-For-Credit-Decisioning: {$ref: '#/components/headers/XNotForCreditDecisioning'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModelVersionResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}

  # ------------------------------------------------------------------ Consent and preferences
  /v1/consents:batchUpsert:
    post:
      tags: [Consent and preferences]
      operationId: batchUpsertConsents
      summary: Host pushes consent records
      description: >-
        Upsert by `consent_ref`. Purposes are validated against the deployment's consent-purpose reference data
        (AD-17), not a contract enum. A withdrawal takes effect immediately for new decisions, triggers recompute of
        affected results and is audited (`consent.applied` event). Rows are accepted or rejected individually; nothing
        is silently corrected. Maximum 5,000 records per call.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - $ref: '#/components/parameters/TraceparentHeader'
        - $ref: '#/components/parameters/XContractVersionHeader'
      security:
        - oidc: [ri.consent.write]
        - oauth2: [ri.consent.write]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConsentBatchUpsertRequest'}
      responses:
        '200':
          description: Per-record result.
          headers:
            X-Correlation-Id: {$ref: '#/components/headers/XCorrelationId'}
            X-Contract-Version: {$ref: '#/components/headers/XContractVersion'}
            X-Not-For-Credit-Decisioning: {$ref: '#/components/headers/XNotForCreditDecisioning'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BatchUpsertResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /v1/preferences:batchUpsert:
    post:
      tags: [Consent and preferences]
      operationId: batchUpsertPreferences
      summary: Host pushes contact preferences, contact limits, vulnerability flag refs and suppressions
      description: >-
        Upsert by `customer_token`. Carries marketing opt-outs, channel preferences, contact limits and quiet hours
        (inputs to CTL-CONTACT-LIMIT), vulnerability flag references (never details) and offer suppressions such as the
        credit-platform "pause offers" flag (`suppressions[].type = PAUSE_OFFERS`, `origin = CREDIT_PLATFORM`,
        planning/15 §11 CI-2), which only suppress and are never used as features. Maximum 5,000 records per call.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - $ref: '#/components/parameters/TraceparentHeader'
        - $ref: '#/components/parameters/XContractVersionHeader'
      security:
        - oidc: [ri.consent.write]
        - oauth2: [ri.consent.write]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PreferenceBatchUpsertRequest'}
            examples:
              pauseOffers:
                $ref: '#/components/examples/PreferenceBatchUpsertExample'
      responses:
        '200':
          description: Per-record result.
          headers:
            X-Correlation-Id: {$ref: '#/components/headers/XCorrelationId'}
            X-Contract-Version: {$ref: '#/components/headers/XContractVersion'}
            X-Not-For-Credit-Decisioning: {$ref: '#/components/headers/XNotForCreditDecisioning'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BatchUpsertResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/RateLimited'}

  # ------------------------------------------------------------------ Bulk ingest
  /v1/ingest/batches:
    post:
      tags: [Bulk ingest]
      operationId: createIngestBatch
      summary: Open a bulk ingest batch (stateful mode)
      description: Opens a batch for one entity type. Parts are uploaded with PUT and the batch is committed with `:commit`. Every batch is the lineage root (`ingest_batch`, planning/07).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - $ref: '#/components/parameters/TraceparentHeader'
        - $ref: '#/components/parameters/XContractVersionHeader'
      security:
        - oidc: [ri.ingest.write]
        - oauth2: [ri.ingest.write]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IngestBatchCreateRequest'}
      responses:
        '201':
          description: Batch opened.
          headers:
            Location: {$ref: '#/components/headers/Location'}
            X-Correlation-Id: {$ref: '#/components/headers/XCorrelationId'}
            X-Contract-Version: {$ref: '#/components/headers/XContractVersion'}
            X-Not-For-Credit-Decisioning: {$ref: '#/components/headers/XNotForCreditDecisioning'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IngestBatchResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /v1/ingest/batches/{batch_id}:
    get:
      tags: [Bulk ingest]
      operationId: getIngestBatch
      summary: Batch status with counts, rejects and validation report
      parameters:
        - $ref: '#/components/parameters/BatchIdPath'
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - $ref: '#/components/parameters/TraceparentHeader'
        - $ref: '#/components/parameters/XContractVersionHeader'
      security:
        - oidc: [ri.ingest.read]
        - oauth2: [ri.ingest.read]
      responses:
        '200':
          description: Batch status.
          headers:
            X-Correlation-Id: {$ref: '#/components/headers/XCorrelationId'}
            X-Contract-Version: {$ref: '#/components/headers/XContractVersion'}
            X-Not-For-Credit-Decisioning: {$ref: '#/components/headers/XNotForCreditDecisioning'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IngestBatchResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /v1/ingest/batches/{batch_id}/parts/{part_number}:
    put:
      tags: [Bulk ingest]
      operationId: putIngestBatchPart
      summary: Upload one part (NDJSON, max 100 MB)
      description: Each line is one record of the batch's entity type in the canonical shape (or the host shape named by `mapping_ref`). Re-uploading the same part with the same digest is idempotent; a different digest for a committed part is 409 `IDEMPOTENCY_CONFLICT`.
      parameters:
        - $ref: '#/components/parameters/BatchIdPath'
        - $ref: '#/components/parameters/PartNumberPath'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/ContentSha256Header'
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - $ref: '#/components/parameters/TraceparentHeader'
        - $ref: '#/components/parameters/XContractVersionHeader'
      security:
        - oidc: [ri.ingest.write]
        - oauth2: [ri.ingest.write]
      requestBody:
        required: true
        content:
          application/x-ndjson:
            schema:
              type: string
              contentMediaType: application/x-ndjson
              description: Newline-delimited JSON records of the batch entity type.
      responses:
        '200':
          description: Part received.
          headers:
            X-Correlation-Id: {$ref: '#/components/headers/XCorrelationId'}
            X-Contract-Version: {$ref: '#/components/headers/XContractVersion'}
            X-Not-For-Credit-Decisioning: {$ref: '#/components/headers/XNotForCreditDecisioning'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IngestPartReceiptResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /v1/ingest/batches/{batch_id}:commit:
    post:
      tags: [Bulk ingest]
      operationId: commitIngestBatch
      summary: Commit a batch (asynchronous validation and load)
      description: >-
        Validates every row (DQ-01..DQ-10, planning/07 §4.1), de-duplicates on `dedupe_key`, writes accepted rows and a
        validation report, and emits `ingest.completed`. Rejects go to the report and are never silently corrected.
        In a standalone deployment any row without `is_synthetic = true` is rejected (AD-19).
      parameters:
        - $ref: '#/components/parameters/BatchIdPath'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - $ref: '#/components/parameters/TraceparentHeader'
        - $ref: '#/components/parameters/XContractVersionHeader'
      security:
        - oidc: [ri.ingest.write]
        - oauth2: [ri.ingest.write]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IngestBatchCommitRequest'}
      responses:
        '202':
          description: Commit accepted; poll the batch for the result.
          headers:
            Location: {$ref: '#/components/headers/Location'}
            X-Correlation-Id: {$ref: '#/components/headers/XCorrelationId'}
            X-Contract-Version: {$ref: '#/components/headers/XContractVersion'}
            X-Not-For-Credit-Decisioning: {$ref: '#/components/headers/XNotForCreditDecisioning'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IngestBatchResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}

  # ------------------------------------------------------------------ DSR and audit
  /v1/dsr-requests:
    post:
      tags: [Data subject requests]
      operationId: createDsrRequest
      summary: Data subject request intake (placeholder in v1)
      description: Access, delete or object-to-profiling by token. Deletion of chained audit and decision-log data is by crypto-shredding (planning/07 §8.2) [LEGAL-CONFIRM]. Full DSR support is post-MVP.
      x-status: placeholder
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - $ref: '#/components/parameters/TraceparentHeader'
        - $ref: '#/components/parameters/XContractVersionHeader'
      security:
        - oidc: [ri.dsr.write]
        - oauth2: [ri.dsr.write]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DsrRequestCreate'}
      responses:
        '202':
          description: Request recorded.
          headers:
            X-Correlation-Id: {$ref: '#/components/headers/XCorrelationId'}
            X-Contract-Version: {$ref: '#/components/headers/XContractVersion'}
            X-Not-For-Credit-Decisioning: {$ref: '#/components/headers/XNotForCreditDecisioning'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DsrRequestResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /v1/audit/records:
    get:
      tags: [Audit]
      operationId: exportAuditRecords
      summary: Export hash-chained audit and decision-log records
      description: >-
        `application/x-ndjson` streams one `AuditExportRecord` per line; the next cursor is in the `X-Next-Cursor`
        header. `application/json` returns the same records as a page. Tokenised; no PII. When the bundle is
        ILLUSTRATIVE every record carries the watermark. The export is the auditor's read path (read-only,
        time-bounded by `from`/`to`, one data cell); it is not a customer directory, and the export itself writes an
        `audit_record` with an `access` block (access kind `EXPORT`; contract 1.2.0, V-8, DEC-68). Directory access
        records (`access` block) are exported here so auditors review who looked up or listed which customers.
      x-activity: AUDIT_EXPORT
      parameters:
        - name: from
          in: query
          required: true
          description: Inclusive start (UTC).
          schema: {type: string, format: date-time}
        - name: to
          in: query
          required: true
          description: Exclusive end (UTC).
          schema: {type: string, format: date-time}
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/CursorQuery'
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - $ref: '#/components/parameters/TraceparentHeader'
        - $ref: '#/components/parameters/XContractVersionHeader'
      security:
        - oidc: [ri.audit.export]
        - oauth2: [ri.audit.export]
      responses:
        '200':
          description: Records ordered by (ts, audit_id).
          headers:
            X-Next-Cursor: {$ref: '#/components/headers/XNextCursor'}
            X-Illustrative: {$ref: '#/components/headers/XIllustrative'}
            X-Correlation-Id: {$ref: '#/components/headers/XCorrelationId'}
            X-Contract-Version: {$ref: '#/components/headers/XContractVersion'}
            X-Not-For-Credit-Decisioning: {$ref: '#/components/headers/XNotForCreditDecisioning'}
          content:
            application/x-ndjson:
              schema:
                type: string
                contentMediaType: application/x-ndjson
                description: One AuditExportRecord JSON object per line.
            application/json:
              schema: {$ref: '#/components/schemas/AuditExportPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}

components:
  securitySchemes:
    oidc:
      type: openIdConnect
      description: >-
        OIDC bearer JWT validated against the host JWKS (plugin) or the local issuer (standalone). Required claims:
        `ri_deployment` (equals the instance deployment_id) and `ri_jurisdictions` (subtrees the caller may act for).
        Request context outside the claimed subtrees returns 403 `JURISDICTION_NOT_PERMITTED`. Staff-originated
        calls carry an `act` claim or `X-On-Behalf-Of`. Tokens are short-lived; refresh tokens are not accepted.
        Scopes are listed on the `oauth2` scheme. The discovery URL below is a placeholder (host IdP is DEC-30).
      openIdConnectUrl: https://issuer.invalid/.well-known/openid-configuration
    oauth2:
      type: oauth2
      description: Scope catalogue (planning/15 §5, role matrix §5.1). Hosts use client credentials; staff use authorization code via the OIDC issuer. Tokens are JWT bearer.
      flows:
        clientCredentials:
          tokenUrl: https://issuer.invalid/oauth2/token
          scopes: &riScopes
            ri.meta.read: Capabilities and readiness
            ri.insights.read: Customer profile and composite evaluate
            ri.customers.list: Purpose-bound customer directory (staff picker; analyst and relationship_staff only; contract 1.2.0, DEC-68)
            ri.transactions.enrich: Transaction enrichment
            ri.transactions.read: Read stored enriched transactions (purpose INSIGHT; staff customer view)
            ri.segments.read: Segment memberships
            ri.predictions.read: Churn score and needs
            ri.recommendations.generate: Generate suggestions and referrals
            ri.recommendations.feedback: Report recommendation outcomes and review results
            ri.retention.read: Retention action suggestions
            ri.retention.feedback: Report retention outcomes and review results
            ri.review.read: Read the human review queue
            ri.review.write: Transition review items
            ri.explanations.read: Read explanations
            ri.policy.query: Policy decision query (dry run)
            ri.policy.read: Read packs, pack status and simulation results
            ri.policy.author: Upload, validate and submit packs (maker)
            ri.policy.approve: Per-policy approval (checker); unassigned while DEC-11 is open
            ri.sharia.approve: Sharia approval record (ISLAMIC deployments only); unassigned until DEC-63 names a person
            ri.policy.release: Pack activation (ACTIVE, or ILLUSTRATIVE in a demo)
            ri.policy.simulate: Run the policy simulator
            ri.policy.overlay.write: Supply host overlays (plugin)
            ri.models.read: Read the model registry
            ri.models.write: Change registry status
            ri.consent.write: Push consent and preference records
            ri.ingest.write: Bulk ingest
            ri.ingest.read: Bulk ingest status
            ri.dsr.write: Data subject requests
            ri.audit.export: Audit export, decision read and replay
            ri.assistant.use: Staff assistant
            ri.portfolio.read: Aggregate-only portfolio summary (no tokens or personal data)
        authorizationCode:
          authorizationUrl: https://issuer.invalid/oauth2/authorize
          tokenUrl: https://issuer.invalid/oauth2/token
          scopes: *riScopes

  parameters:
    CustomerTokenPath:
      name: customer_token
      in: path
      required: true
      description: Host-issued customer token. Never a name or national identifier.
      schema: {$ref: '#/components/schemas/Token'}
    RecIdPath:
      name: rec_id
      in: path
      required: true
      description: Recommendation id.
      schema: {$ref: '#/components/schemas/Identifier'}
    ActionIdPath:
      name: action_id
      in: path
      required: true
      description: Retention action id.
      schema: {$ref: '#/components/schemas/Identifier'}
    ReviewItemIdPath:
      name: review_item_id
      in: path
      required: true
      description: Review item id.
      schema: {$ref: '#/components/schemas/Identifier'}
    ResultIdPath:
      name: result_id
      in: path
      required: true
      description: Result id returned in a prior response.
      schema: {$ref: '#/components/schemas/Identifier'}
    DecisionIdPath:
      name: decision_id
      in: path
      required: true
      description: Decision-log record id.
      schema: {$ref: '#/components/schemas/Identifier'}
    PackIdPath:
      name: pack_id
      in: path
      required: true
      description: Pack id.
      schema: {$ref: '#/components/schemas/PackId'}
    PackVersionPath:
      name: version
      in: path
      required: true
      description: Pack SemVer version.
      schema: {$ref: '#/components/schemas/SemVer'}
    SimulationIdPath:
      name: simulation_id
      in: path
      required: true
      description: Simulation id.
      schema: {$ref: '#/components/schemas/Identifier'}
    OverlayIdPath:
      name: overlay_id
      in: path
      required: true
      description: Host overlay id.
      schema: {$ref: '#/components/schemas/Identifier'}
    ModelIdPath:
      name: model_id
      in: path
      required: true
      description: Registry model id.
      schema: {$ref: '#/components/schemas/Identifier'}
    ModelVersionPath:
      name: version
      in: path
      required: true
      description: Registry entry version.
      schema: {$ref: '#/components/schemas/VersionLabel'}
    BatchIdPath:
      name: batch_id
      in: path
      required: true
      description: Ingest batch id.
      schema: {$ref: '#/components/schemas/Identifier'}
    PartNumberPath:
      name: part_number
      in: path
      required: true
      description: 1-based part number.
      schema: {type: integer, minimum: 1, maximum: 10000}
    ResidenceJurisdictionQuery:
      name: residence_jurisdiction
      in: query
      required: true
      description: Coarse residence jurisdiction code (reference data); `UNKNOWN` when the host does not know it (restrictive default).
      schema: {$ref: '#/components/schemas/JurisdictionCode'}
    BookingEntityJurisdictionQuery:
      name: booking_entity_jurisdiction
      in: query
      required: false
      description: Jurisdiction of the booking legal entity.
      schema: {$ref: '#/components/schemas/JurisdictionCode'}
    ServicingLocationQuery:
      name: servicing_location
      in: query
      required: false
      description: Servicing or channel location jurisdiction.
      schema: {$ref: '#/components/schemas/JurisdictionCode'}
    ChannelQuery:
      name: channel
      in: query
      required: false
      description: Channel on which the output would be surfaced.
      schema: {$ref: '#/components/schemas/Channel'}
    PurposeQuery:
      name: purpose
      in: query
      required: true
      description: Consent purpose for this processing (reference data, AD-17).
      schema: {$ref: '#/components/schemas/ConsentPurpose'}
    AccessPurposeQuery:
      name: access_purpose
      in: query
      required: true
      description: >-
        Approved access purpose (closed list, contract 1.2.0, DEC-68), registered for the caller's role and client.
        Separate from the consent `purpose`. Missing or unknown -> 400 `ACCESS_PURPOSE_INVALID`; not registered for the
        caller -> 403 `ACCESS_PURPOSE_NOT_REGISTERED`.
      schema: {$ref: '#/components/schemas/DirectoryAccessPurpose'}
    ConsentRefQuery:
      name: consent_ref
      in: query
      required: false
      description: Host consent record references backing the purpose.
      style: form
      explode: true
      schema:
        type: array
        maxItems: 20
        items: {$ref: '#/components/schemas/Token'}
    AsOfQuery:
      name: as_of
      in: query
      required: false
      description: Point in time for policy selection and replay; defaults to now.
      schema: {$ref: '#/components/schemas/AsOf'}
    LimitQuery:
      name: limit
      in: query
      required: false
      description: Page size (cursor pagination; no offset pagination).
      schema: {type: integer, minimum: 1, maximum: 500, default: 100}
    CursorQuery:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from `next_cursor`.
      schema: {type: string, maxLength: 512}
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Required on every POST and PUT that creates, ingests or changes state. Stored 24 h with the request hash; a
        replay returns the original response; the same key with a different payload hash returns 409
        `IDEMPOTENCY_CONFLICT`. Evaluate calls are deterministic, so retries are safe.
      schema: {type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9_.:-]+$'}
    XCorrelationIdHeader:
      name: X-Correlation-Id
      in: header
      required: false
      description: Caller correlation id; echoed in every response and event. Generated if absent. A body `correlation_id` must match it when both are sent.
      schema: {$ref: '#/components/schemas/CorrelationId'}
    TraceparentHeader:
      name: traceparent
      in: header
      required: false
      description: W3C Trace Context.
      schema: {type: string, pattern: '^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$'}
    XContractVersionHeader:
      name: X-Contract-Version
      in: header
      required: false
      description: Optional pin to a served minor version (e.g. `1.0`). Unserved pin returns 412 `CONTRACT_VERSION_UNSUPPORTED`.
      schema: {type: string, pattern: '^1(\.[0-9]+){0,2}$'}
    XOnBehalfOfHeader:
      name: X-On-Behalf-Of
      in: header
      required: false
      description: Signed token naming the staff actor for audit, when the bearer token has no `act` claim.
      schema: {type: string, maxLength: 4096}
    ContentSha256Header:
      name: X-Content-SHA256
      in: header
      required: true
      description: Hex SHA-256 of the part body.
      schema: {$ref: '#/components/schemas/Sha256'}

  headers:
    XCorrelationId:
      description: Correlation id of the request.
      schema: {$ref: '#/components/schemas/CorrelationId'}
    XContractVersion:
      description: Full contract version that served the response.
      schema: {$ref: '#/components/schemas/SemVer'}
    XNotForCreditDecisioning:
      description: Purpose-limitation label (IC7, DEC-42). Always `true`.
      required: true
      schema: {type: string, const: 'true'}
    XIllustrative:
      description: '`true` when the runtime bundle is ILLUSTRATIVE (standalone demo only).'
      schema: {type: string, enum: ['true', 'false']}
    XNextCursor:
      description: Cursor for the next page; absent on the last page.
      schema: {type: string, maxLength: 512}
    Location:
      description: URL of the created or tracked resource.
      schema: {type: string, format: uri-reference}
    RetryAfter:
      description: Seconds to wait before retrying.
      schema: {type: integer, minimum: 0}
    RateLimitLimit:
      description: Request quota in the current window (IETF RateLimit header fields draft).
      schema: {type: integer, minimum: 0}
    RateLimitRemaining:
      description: Remaining requests in the current window.
      schema: {type: integer, minimum: 0}
    RateLimitReset:
      description: Seconds until the quota resets.
      schema: {type: integer, minimum: 0}

  responses:
    BadRequest:
      description: '`VALIDATION_FAILED` - schema violation, unknown request field (strict mode), bad currency, sensitive attribute in an extension bag, unsigned overlay. Customer directory (1.2.0): `ACCESS_PURPOSE_INVALID` (missing or unknown `access_purpose`), `NARROWING_FILTER_REQUIRED` (enumeration without a narrowing filter).'
      headers:
        X-Correlation-Id: {$ref: '#/components/headers/XCorrelationId'}
        X-Not-For-Credit-Decisioning: {$ref: '#/components/headers/XNotForCreditDecisioning'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          examples:
            validation:
              $ref: '#/components/examples/ProblemValidationExample'
    Unauthenticated:
      description: '`UNAUTHENTICATED` - missing, invalid or expired token.'
      headers:
        X-Correlation-Id: {$ref: '#/components/headers/XCorrelationId'}
        X-Not-For-Credit-Decisioning: {$ref: '#/components/headers/XNotForCreditDecisioning'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Forbidden:
      description: >-
        `FORBIDDEN_SCOPE`, `JURISDICTION_NOT_PERMITTED` (token claims do not cover the request context), or a policy
        denial - `CONSENT_MISSING`, `POLICY_DENIED`, `MINOR_PROTECTED` - with `decision_id`. Customer directory (1.2.0):
        `ACCESS_PURPOSE_NOT_REGISTERED` (purpose valid but not registered for the caller's role or client).
      headers:
        X-Correlation-Id: {$ref: '#/components/headers/XCorrelationId'}
        X-Not-For-Credit-Decisioning: {$ref: '#/components/headers/XNotForCreditDecisioning'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          examples:
            consentMissing:
              $ref: '#/components/examples/ProblemConsentMissingExample'
    NotFound:
      description: '`NOT_FOUND` - unknown token, result or resource. The same 404 is returned across jurisdictions (no existence leak).'
      headers:
        X-Correlation-Id: {$ref: '#/components/headers/XCorrelationId'}
        X-Not-For-Credit-Decisioning: {$ref: '#/components/headers/XNotForCreditDecisioning'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflict:
      description: >-
        `IDEMPOTENCY_CONFLICT` (same key, different payload hash); governance transitions not allowed from the current
        state - `PACK_STATE_INVALID`, `REVIEW_STATE_INVALID`, `MAKER_CHECKER_VIOLATION`, `ILLUSTRATIVE_NOT_PERMITTED`,
        `MODEL_APPROVAL_UNAVAILABLE`.
      headers:
        X-Correlation-Id: {$ref: '#/components/headers/XCorrelationId'}
        X-Not-For-Credit-Decisioning: {$ref: '#/components/headers/XNotForCreditDecisioning'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    ContractVersionUnsupported:
      description: '`CONTRACT_VERSION_UNSUPPORTED` - the pinned contract version is not served.'
      headers:
        X-Correlation-Id: {$ref: '#/components/headers/XCorrelationId'}
        X-Not-For-Credit-Decisioning: {$ref: '#/components/headers/XNotForCreditDecisioning'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    PayloadTooLarge:
      description: '`PAYLOAD_TOO_LARGE` - 5 MB JSON per request, 5,000 transactions or records per call, 100 MB per bulk part.'
      headers:
        X-Correlation-Id: {$ref: '#/components/headers/XCorrelationId'}
        X-Not-For-Credit-Decisioning: {$ref: '#/components/headers/XNotForCreditDecisioning'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unprocessable:
      description: >-
        `OUT_OF_SCOPE_REQUEST` (credit-decision ask, handoff message included), `UNSUPPORTED_JURISDICTION`,
        `DATA_QUALITY_INSUFFICIENT` (failing DQ `rule_id`s in `details`; gaps are never filled by guess),
        `ILLUSTRATIVE_NOT_APPROVABLE`.
      headers:
        X-Correlation-Id: {$ref: '#/components/headers/XCorrelationId'}
        X-Not-For-Credit-Decisioning: {$ref: '#/components/headers/XNotForCreditDecisioning'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    RateLimited:
      description: '`RATE_LIMITED` - per-client token bucket exceeded. `ACCESS_QUOTA_EXCEEDED` - per-user daily quota of a purpose-bound or aggregate read exceeded (customer directory, contract 1.2.0).'
      headers:
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
        RateLimit-Limit: {$ref: '#/components/headers/RateLimitLimit'}
        RateLimit-Remaining: {$ref: '#/components/headers/RateLimitRemaining'}
        RateLimit-Reset: {$ref: '#/components/headers/RateLimitReset'}
        X-Correlation-Id: {$ref: '#/components/headers/XCorrelationId'}
        X-Not-For-Credit-Decisioning: {$ref: '#/components/headers/XNotForCreditDecisioning'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    ServiceUnavailable:
      description: '`POLICY_UNAVAILABLE` (policy bundle not verified; fail closed) or `DEPENDENCY_UNAVAILABLE`.'
      headers:
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
        X-Correlation-Id: {$ref: '#/components/headers/XCorrelationId'}
        X-Not-For-Credit-Decisioning: {$ref: '#/components/headers/XNotForCreditDecisioning'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}

