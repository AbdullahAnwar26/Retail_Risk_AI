      type: object
      x-ri-output-class: CUSTOMER_OUTCOME
      required: [status, decision_id, needs]
      properties:
        status: {type: string, const: OK}
        decision_id: {$ref: '#/components/schemas/Identifier'}
        needs:
          type: array
          items: {$ref: '#/components/schemas/Need'}
    ChurnSection:
      type: object
      x-ri-output-class: CUSTOMER_OUTCOME
      required: [status, decision_id, churn]
      properties:
        status: {type: string, const: OK}
        decision_id: {$ref: '#/components/schemas/Identifier'}
        churn: {$ref: '#/components/schemas/ChurnScore'}
    RecommendationsSection:
      type: object
      x-ri-output-class: CUSTOMER_OUTCOME
      required: [status, decision_id, recommendations, suppressed, institution_type]
      allOf:
        - $ref: '#/components/schemas/ShariaDisclosurePresenceRule'
      properties:
        institution_type: {$ref: '#/components/schemas/InstitutionType'}
        status: {type: string, const: OK}
        decision_id: {$ref: '#/components/schemas/Identifier'}
        recommendations:
          type: array
          items: {$ref: '#/components/schemas/Recommendation'}
        suppressed:
          type: array
          items: {$ref: '#/components/schemas/SuppressedCandidate'}
    CompositeEvaluateResponse:
      x-ri-output-class: CUSTOMER_OUTCOME
      allOf:
        - $ref: '#/components/schemas/CustomerResponseLabels'
        - type: object
          required: [sections]
          properties:
            sections:
              type: object
              required: [insights, segments, needs, churn, recommendations]
              properties:
                insights:
                  oneOf:
                    - $ref: '#/components/schemas/InsightsSection'
                    - $ref: '#/components/schemas/SectionDenied'
                segments:
                  oneOf:
                    - $ref: '#/components/schemas/SegmentsSection'
                    - $ref: '#/components/schemas/SectionDenied'
                needs:
                  oneOf:
                    - $ref: '#/components/schemas/NeedsSection'
                    - $ref: '#/components/schemas/SectionDenied'
                churn:
                  oneOf:
                    - $ref: '#/components/schemas/ChurnSection'
                    - $ref: '#/components/schemas/SectionDenied'
                recommendations:
                  oneOf:
                    - $ref: '#/components/schemas/RecommendationsSection'
                    - $ref: '#/components/schemas/SectionDenied'
            explanation: {$ref: '#/components/schemas/Explanation'}
        - if:
            properties: {illustrative: {const: false}}
          then:
            properties:
              sections:
                properties:
                  recommendations: {$ref: '#/components/schemas/ShariaDisclosureLiveRule'}

