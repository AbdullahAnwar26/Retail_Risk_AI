            permitted_use: {$ref: '#/components/schemas/PermittedUse'}
    ReviewItemPage:
      x-ri-output-class: CUSTOMER_OUTCOME
      allOf:
        - $ref: '#/components/schemas/ResponseLabels'
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items, permitted_use]
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/ReviewItem'}
            permitted_use: {$ref: '#/components/schemas/PermittedUse'}
    ReviewTransitionRequest:
      type: object
